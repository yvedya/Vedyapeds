<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>An update</title>
<link rel="icon" href="/icon-192.png">
<style>
  :root{--bg:#faf9f6;--surface:#fff;--ink:#1f1d1a;--muted:#8a8780;--line:#e8e5dd;--accent:#3a5a40}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:40px 22px 80px}
  .eyebrow{text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;font-size:34px;text-align:center;margin:0 0 6px}
  .date{text-align:center;color:var(--muted);font-size:13px;margin-bottom:30px}
  .greeting{font-family:Georgia,serif;font-style:italic;font-size:20px;line-height:1.6;color:#33312e;margin:0 auto 22px;max-width:560px;text-align:center}
  .hl{list-style:none;padding:0;max-width:540px;margin:0 auto 30px}
  .hl li{font-family:Georgia,serif;font-size:18px;padding:9px 0;border-bottom:1px solid var(--line);color:#33312e}
  .hl li:last-child{border-bottom:none}
  .hl li::before{content:'✦';color:var(--accent);margin-right:10px;font-size:13px;vertical-align:1px}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:8px 0 26px}
  .shot{position:relative;border-radius:14px;overflow:hidden;background:#eee;aspect-ratio:4/5}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 9px;color:#fff;font-size:12.5px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .shot .cap .pl{display:block;font-size:11px;opacity:.85;margin-top:2px}
  .refl-h{font-family:Georgia,serif;font-size:20px;margin:34px 0 8px;color:var(--accent)}
  .refl{font-family:Georgia,serif;font-style:italic;font-size:17px;line-height:1.6;border-left:3px solid var(--line);padding:6px 0 6px 16px;margin:14px 0;color:#33312e}
  .refl .rd{display:block;font-style:normal;font-family:'Inter',sans-serif;font-size:11px;color:var(--muted);margin-top:5px}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:48px}
  .state{text-align:center;color:var(--muted);padding:80px 20px;font-size:15px}
  .state h1{font-size:24px;color:var(--ink);margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="state">Loading…</div></div>
<script>
(async function(){
  const app=document.getElementById('app');
  const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const s=new URLSearchParams(location.search).get('s');
  const fail=(msg)=>{app.innerHTML='<div class="state"><h1>This page isn’t available</h1>'+esc(msg||'The link may be inactive or out of date.')+'</div>';};
  if(!s){fail('No share link found.');return;}
  let d;
  try{const r=await fetch('/.netlify/functions/friends?s='+encodeURIComponent(s));d=await r.json();if(!r.ok||d.error)throw 0;}
  catch(e){fail();return;}
  const when=d.publishedAt?new Date(d.publishedAt).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'';
  const greeting=d.greeting?`<div class="greeting">${esc(d.greeting)}</div>`:'';
  const hl=(d.highlights&&d.highlights.length)?'<ul class="hl">'+d.highlights.map(h=>`<li>${esc(h)}</li>`).join('')+'</ul>':'';
  const gallery=(d.photos&&d.photos.length)?'<div class="gallery">'+d.photos.map(p=>`<div class="shot"><img loading="lazy" src="${esc(p.url)}" alt="">${(p.cap||p.place)?`<div class="cap">${esc(p.cap||'')}${p.place?`<span class="pl">📍 ${esc(p.place)}</span>`:''}</div>`:''}</div>`).join('')+'</div>':'';
  const refl=(d.reflections&&d.reflections.length)?'<div class="refl-h">Reflections</div>'+d.reflections.map(r=>`<div class="refl">${esc(r.text)}${r.date?`<span class="rd">${esc(r.date)}</span>`:''}</div>`).join(''):'';
  app.innerHTML=`<div class="eyebrow">An update</div><h1>What I’ve been up to</h1>${when?`<div class="date">${esc(when)}</div>`:''}${greeting}${hl}${gallery}${refl}<div class="foot">Shared privately · a quiet little corner of life ♡</div>`;
  document.title='An update · what I’ve been up to';
})();
</script>
</body>
</html>
