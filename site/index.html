// ---- AI auto-tagging (sandbox: direct call; swap to serverless endpoint for web) ----
// ===== ANKICONNECT SYNC (activates when app runs locally with Anki desktop open) =====
let ankiSyncState='', ankiLastSync=null;
async function ankiInvoke(action,params){
  const res=await fetch('http://127.0.0.1:8765',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action,version:6,params:params||{}})});
  const data=await res.json();
  if(data.error)throw new Error(data.error);
  return data.result;
}
async function ankiSync(){
  ankiSyncState='syncing';if(current==='study')renderStudy();
  try{
    for(const e of entries){
      if(e.type!=='knowledge'||!(e.cards||[]).length)continue;
      let cardIds=[];
      try{cardIds=await ankiInvoke('findCards',{query:`tag:repo::${e.id}`});}catch(err){cardIds=[];}
      if(!cardIds.length){e.anki={found:0,new:0,learning:0,young:0,mature:0,due:0,synced:new Date().toISOString()};continue;}
      const info=await ankiInvoke('cardsInfo',{cards:cardIds});
      const today=Math.floor(Date.now()/86400000);let st={found:info.length,new:0,learning:0,young:0,mature:0,due:0};
      info.forEach(c=>{
        const ivl=c.interval||0;
        if(c.type===0||c.queue===0)st.new++;
        else if(c.queue===1||c.queue===3||c.type===1)st.learning++;
        else if(ivl>=21)st.mature++;
        else st.young++;
        if((c.queue===2&&c.due<=today)||c.queue===1||c.queue===3)st.due++;
      });
      st.synced=new Date().toISOString();
      e.anki=st;
    }
    await saveEntries();
    ankiSyncState='ok';ankiLastSync=new Date().toISOString();
  }catch(err){console.warn('Anki sync failed',err);ankiSyncState='unreachable';}
  if(current==='study')renderStudy();
}
function ankiRollup(filterFn){
  const ns=entries.filter(e=>e.type==='knowledge'&&e.anki&&(!filterFn||filterFn(e)));
  const agg={found:0,new:0,learning:0,young:0,mature:0,due:0,notes:ns.length};
  ns.forEach(e=>{['found','new','learning','young','mature','due'].forEach(k=>agg[k]+=(e.anki[k]||0));});
  return agg;
}
function exportCards(note){
  if(!note||!note.cards||!note.cards.length)return;
  const subjTag=[note.subject,note.subcat].filter(Boolean).join('::').replace(/\s+/g,'_');
  const idTag='repo::'+note.id;
  const tags=[idTag,subjTag].filter(Boolean).join(' ');
  const lines=note.cards.map(c=>{
    const text=c.replace(/\t/g,' ').replace(/\r?\n/g,'<br>');
    return `${text}\t${tags}`;
  });
  const blob=new Blob([lines.join('\n')],{type:'text/plain'});
  const url=URL.createObjectURL(blob);

// ---- minimal EXIF reader: DateTimeOriginal + GPS, parsed from JPEG APP1 ----
function readExif(buffer){
  try{
    const dv=new DataView(buffer);
    if(dv.getUint16(0)!==0xFFD8)return null; // not JPEG
    let off=2;const len=dv.byteLength;
    while(off<len){
      if(dv.getUint16(off)!==0xFFE1){ // find APP1
        if((dv.getUint16(off)&0xFF00)!==0xFF00)break;
        off+=2+dv.getUint16(off+2);continue;
      }
      const segStart=off+4;
      if(dv.getUint32(segStart)!==0x45786966){off+=2+dv.getUint16(off+2);continue;} // not Exif APP1, keep scanning
      const tiff=segStart+6;
      const little=dv.getUint16(tiff)===0x4949;
      const u16=o=>dv.getUint16(o,little),u32=o=>dv.getUint32(o,little);
      const ifd0=tiff+u32(tiff+4);
      let result={};
      const readIFD=(start)=>{
        const n=u16(start);const tags={};
        for(let i=0;i<n;i++){
          const e=start+2+i*12;const tag=u16(e);const type=u16(e+2);const count=u32(e+4);
          tags[tag]={type,count,valOff:e+8};
        }
        return tags;
      };
      const t0=readIFD(ifd0);
      const str=(entry)=>{let o=entry.count>4?tiff+u32(entry.valOff):entry.valOff;let s='';for(let i=0;i<entry.count-1;i++)s+=String.fromCharCode(dv.getUint8(o+i));return s;};
      // ExifIFD pointer = 0x8769
      if(t0[0x8769]){
        const exifIFD=tiff+u32(t0[0x8769].valOff);
        const te=readIFD(exifIFD);
        if(te[0x9003])result.dateTime=str(te[0x9003]); // DateTimeOriginal "YYYY:MM:DD HH:MM:SS"
        else if(te[0x9004])result.dateTime=str(te[0x9004]);
      }
      if(!result.dateTime&&t0[0x0132])result.dateTime=str(t0[0x0132]); // fallback DateTime
      // GPS IFD = 0x8825
      if(t0[0x8825]){
        const gpsIFD=tiff+u32(t0[0x8825].valOff);
        const tg=readIFD(gpsIFD);
        const rational=(entry,idx)=>{const o=tiff+u32(entry.valOff)+idx*8;return u32(o)/u32(o+4);};
        const dms=(entry)=>rational(entry,0)+rational(entry,1)/60+rational(entry,2)/3600;
        if(tg[0x0002]&&tg[0x0004]){
          let lat=dms(tg[0x0002]),lon=dms(tg[0x0004]);
          const latRef=tg[0x0001]?String.fromCharCode(dv.getUint8(tg[0x0001].valOff)):'N';
          const lonRef=tg[0x0003]?String.fromCharCode(dv.getUint8(tg[0x0003].valOff)):'E';
          if(latRef==='S')lat=-lat;if(lonRef==='W')lon=-lon;
          result.gps={lat:+lat.toFixed(6),lon:+lon.toFixed(6)};
        }
      }
      return result;
    }
  }catch(e){console.warn('exif parse failed',e);}
  return null;
}
function exifDateToISO(s){
  // "YYYY:MM:DD HH:MM:SS" -> "YYYY-MM-DD"
  const m=(s||'').match(/^(\d{4}):(\d{2}):(\d{2})/);
  return m?`${m[1]}-${m[2]}-${m[3]}`:null;
}
function dateFromFilename(name){
  // common camera patterns: PXL_20260430_..., IMG_20260430_..., 20260430_..., 2026-04-30...
  let m=(name||'').match(/(20\d{2})[-_]?(\d{2})[-_]?(\d{2})/);
  if(m){const y=+m[1],mo=+m[2],d=+m[3];if(mo>=1&&mo<=12&&d>=1&&d<=31)return `${m[1]}-${m[2]}-${m[3]}`;}
  return null;
}

function processFiles(files){
  [...files].forEach(f=>{if(!f.type.startsWith('image/'))return;
    const r=new FileReader();
    r.onload=e=>{
      const buf=e.target.result; // ArrayBuffer
      const exif=readExif(buf);
      let isoDate=exif?exifDateToISO(exif.dateTime):null;
      if(!isoDate)isoDate=dateFromFilename(f.name); // fallback: parse date from filename
      const gps=exif?exif.gps:null;
      const blob=new Blob([buf],{type:f.type});const url=URL.createObjectURL(blob);
      const img=new Image();img.onload=async()=>{
        URL.revokeObjectURL(url);
        const max=2000;let{width:w,height:h}=img;
        if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
        const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.85));
        if(!blob){alert('Could not process that image.');return;}
        const path=`${_uid}/${(window.crypto&&crypto.randomUUID?crypto.randomUUID():uid()+uid())}.jpg`;
        try{
          const up=await _sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});
          if(up.error){console.error('upload',up.error);alert('Photo upload failed: '+up.error.message);return;}
          const su=await _sb.storage.from('photos').createSignedUrl(path,3600);
          if(su.data&&su.data.signedUrl)_urlMap[path]=su.data.signedUrl;
        }catch(err){console.error(err);alert('Photo upload failed — check your connection and try again.');return;}
        if(wsImgTarget){const note=entries.find(x=>x.id===wsImgTarget);if(note){note.imgs=note.imgs||[];note.imgs.push(path);if(isoDate&&!note.when)note.when=isoDate;if(gps&&!note.gps)note.gps=gps;commitWsSave?commitWsSave(true):0;saveEntries();renderWorkspace();}}
        else{pendingImgs.push(path);if(isoDate&&!draft.when){draft.when=isoDate;const wf=$('when');if(wf)wf.value=isoDate;}if(gps)pendingGps=gps;renderThumbs();}
      };img.onerror=()=>URL.revokeObjectURL(url);img.src=url;
    };
    r.readAsArrayBuffer(f);
  });
}

function entryHTML(e,ro){
  const t=TYPES[e.type];const a=areaById(e.area);
  // image-forward photo memory card
  if(e.type==='memories'&&e.imgs&&e.imgs.length){
    const tint=e.theme?`style="--mtint:${rgba(e.theme.accent,0.16)};--mtint2:${rgba(e.theme.dom,0.10)}"`:'';
    const activeSrc=e.bg?(e.bgImg||e.imgs[0]):null;
    const shot=(src,idx,hero)=>{const on=activeSrc===src;return `<div class="pm-shot${hero?' pm-hero':''}"><img src="${disp(src)}" data-full="${src}"><button class="pm-bg${hero?'':' sm'} ${on?'on':''}" data-bgid="${e.id}" data-bgidx="${idx}" title="${on?'used as the daily background':'use this photo as the daily background'}">${on?'★':'☆'}</button></div>`;};
    const gallery=e.imgs.length>1?`<div class="pm-extra">${e.imgs.slice(1).map((src,i)=>shot(src,i+1,false)).join('')}</div>`:'';
    const tags=(e.tags||[]).map(tg=>`<span class="tag" data-tag="${esc(tg)}">#${esc(tg)}</span>`).join('');
    const apill=a?`<span class="areapill" style="background:${a.color}22;color:${a.color}">${esc(a.name)}</span>`:'';
    const when=e.when?`<span class="when ${isFuture(e.when)?'future':''}">${relTime(e.when)}</span>`:'';
    return `<div class="entry photomem ${e.bg?'is-bg':''}" ${tint}>
      ${shot(e.imgs[0],0,true)}
      <div class="pm-body"><div class="text md">${mdRender(e.text)}</div>${gallery}
        <div class="foot">${apill}${tags}${when}</div></div>
      <div class="acts"><button class="edit" data-edit="${e.id}" title="edit">✎</button><button class="mv" data-mv="${e.id}" title="move / reassign">⇄</button><button class="del" data-del="${e.id}" title="delete">✕</button></div>
      <div class="menu ${menuOpen===e.id?'open':''}" id="mm-${e.id}">
        <div class="mhead">Change type</div>${TYPE_ORDER.filter(k=>k!==e.type).map(k=>`<button data-move="${e.id}" data-to="${k}">${TYPES[k].label}</button>`).join('')}
        <div class="mhead">Change area</div>${areas.filter(x=>x.id!==e.area).map(x=>`<button data-area="${e.id}" data-aid="${x.id}">${esc(x.name)}</button>`).join('')}</div></div>`;
  }
  const cls=t.cls+(e.done?' done':'');
  const check=t.check?`<div class="check${ro?' ro':''}" ${ro?'':`data-id="${e.id}"`} title="${ro?'completed':''}"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6.5L4.5 9L10 3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`:'';
  const aline=a?`<div class="arealine" style="background:${a.color}"></div>`:'';
  const titleEl=(t.titled&&e.title)?`<div class="etitle">${esc(e.title)}</div>`:'';
  const imgs=(e.imgs&&e.imgs.length)?`<div class="imgs">${e.imgs.map(src=>`<img src="${disp(src)}" data-full="${src}">`).join('')}</div>`:'';
  let linksEl='';
  if(e.links&&e.links.length){
    const valid=e.links.map(id=>entries.find(x=>x.id===id)).filter(Boolean);
    if(valid.length)linksEl=`<div class="links">${valid.map(le=>`<button class="lk" data-goto="${le.id}">${esc(le.title||le.text.slice(0,40))}</button>`).join('')}</div>`;
  }
  const tags=(e.tags||[]).map(tg=>`<span class="tag" data-tag="${esc(tg)}">#${esc(tg)}</span>`).join('');
  const apill=a?`<span class="areapill" style="background:${a.color}22;color:${a.color}">${esc(a.name)}</span>`:'';
  let srcEl='';
  if(e.type==='knowledge'){
    const s=e.source||'field';const m=e.meta||{};
    let cite='';
    if(s==='textbook'&&(m.book||m.chapter))cite=[m.book,m.chapter].filter(Boolean).join(', ');
    else if(s==='article')cite=[m.authors,m.pub,m.year].filter(Boolean).join(' · ');
    else if(s==='field'&&m.context)cite=m.context;
    srcEl=`<div class="srcmeta"><span class="srcbadge" style="color:${SOURCE_COLORS[s]};background:${SOURCE_COLORS[s]}1a">${SOURCES[s].label}</span>${cite?`<span class="cite">${esc(cite)}</span>`:''}${(s==='article'&&m.url)?` <a class="cite-link" href="${esc(m.url)}" target="_blank" rel="noopener">link ↗</a>`:''}</div>`;
  }
  const when=e.when?`<span class="when ${isFuture(e.when)?'future':''}">${relTime(e.when)}</span>`:'';
  const moveTypes=TYPE_ORDER.filter(k=>k!==e.type).map(k=>`<button data-move="${e.id}" data-to="${k}">${TYPES[k].label}</button>`).join('');
  const moveAreas=areas.filter(x=>x.id!==e.area).map(x=>`<button data-area="${e.id}" data-aid="${x.id}">${esc(x.name)}</button>`).join('');
  const textEl=FORMATTED(e.type)?`<div class="text md">${mdRender(e.text)}</div>`:`<div class="text">${esc(e.text)}</div>`;
  const featBtn=e.type==='reflections'?`<button class="feat ${e.featured?'on':''}" data-feat="${e.id}" title="${e.featured?'featured as a daily quote':'feature as a daily quote'}">${e.featured?'★':'☆'}</button>`:'';
  const featBadge=(e.type==='reflections'&&e.featured)?`<span class="feat-badge" title="featured as a daily quote">★ featured</span>`:'';
  let recurEl='';
  if(e.type==='tasks'&&e.every){const d=recurDueDays(e);const lab=d>0?`every ${e.every}d`:(d===0?'due today':`overdue ${-d}d`);recurEl=`<span class="when" title="recurring every ${e.every} day${e.every>1?'s':''}" style="${d<=0?'color:#c0392b;font-weight:600':''}">🔁 ${lab}</span>`;}
  let prioEl='';
  if(e.type==='tasks'&&e.priority){const PM={high:['High','#c0392b'],med:['Med','#c47f17'],low:['Low','#3a7ca5']}[e.priority];if(PM)prioEl=`<span class="when" title="${PM[0]} priority" style="color:${PM[1]};font-weight:600">⚑ ${PM[0]}</span>`;}
  let dueEl='';
  if(e.type==='tasks'&&!e.every&&e.when){const od=!e.done&&e.when<todayISO();dueEl=`<span class="when ${isFuture(e.when)?'future':''}" style="${od?'color:#c0392b;font-weight:600':''}">${od?'overdue · ':'due '}${relTime(e.when)}</span>`;}
  return `<div class="entry ${cls} ${e.featured?'is-featured':''}">${check}${aline}
    <div class="body">${titleEl}${srcEl}${textEl}${imgs}${linksEl}
    <div class="foot">${featBadge}${prioEl}${apill}${tags}${recurEl}${e.type==='tasks'?dueEl:when}</div></div>
    <div class="acts">${featBtn}<button class="edit" data-edit="${e.id}" title="edit">✎</button><button class="mv" data-mv="${e.id}" title="move / reassign">⇄</button><button class="del" data-del="${e.id}" title="delete">✕</button></div>
    <div class="menu ${menuOpen===e.id?'open':''}" id="mm-${e.id}">
      <div class="mhead">Change type</div>${moveTypes}
      <div class="mhead">Change area</div>${moveAreas}</div></div>`;
}

// ---------- HOME ----------
function renderHome(){
  const hr=new Date().getHours();
  const greet=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  const openT=entries.filter(e=>e.type==='tasks'&&!e.done).length;
  const ahead=entries.filter(e=>!e.done&&isFuture(e.when)).length;
  const sub=`${openT?`${openT} open task${openT>1?'s':''}`:'No open tasks'}${ahead?`, and ${ahead} thing${ahead>1?'s':''} ahead`:''}.`;

  // recurring chores that are due / overdue
  const due=dueRecurring();
  const dueEl=due.length?`<div class="home-sec"><div class="sh">Due now${due.length>1?` · ${due.length}`:''}</div>${due.map(e=>{const a=areaById(e.area);const d=recurDueDays(e);const lab=d<0?`${-d}d overdue`:'today';return `<div class="home-row"><button data-rdue="${e.id}" title="mark done" style="border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:6px;width:22px;height:22px;cursor:pointer;flex:none;margin-right:4px">✓</button><span class="rdot" style="background:${a?a.color:'var(--faint)'}"></span><span class="rtext">${esc(e.text)}</span><span class="rwhen future">${lab}</span></div>`;}).join('')}</div>`:'';

  // on this day
  const now=new Date();const md=`${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const otd=entries.filter(e=>e.when&&e.when.slice(5)===md&&e.when.slice(0,4)!==String(now.getFullYear())&&(e.type==='memories'||e.type==='reflections')).sort((a,b)=>b.when.localeCompare(a.when))[0];

  // area cards
  const acards=areas.map(a=>{
    const inArea=entries.filter(e=>e.area===a.id);
    const tasks=inArea.filter(e=>e.type==='tasks'&&!e.done).length;
    const notes=inArea.filter(e=>e.type==='knowledge').length;
    const goals=inArea.filter(e=>e.type==='goals'&&!e.done).length;
    const last=inArea.slice().sort((x,y)=>(y.when||y.created).localeCompare(x.when||x.created))[0];
    const bits=[tasks?`${tasks} task${tasks>1?'s':''}`:'',goals?`${goals} goal${goals>1?'s':''}`:'',notes?`${notes} note${notes>1?'s':''}`:''].filter(Boolean).join(' · ')||'empty';
    return `<div class="acard" data-area="${a.id}"><div class="ah"><span class="dot" style="background:${a.color}"></span><span class="an">${esc(a.name)}</span></div>
      <div class="astat">${bits}</div>${last?`<div class="alast">${esc(last.title||last.text)}</div>`:''}</div>`;
  }).join('');

  const todays=entries.filter(e=>(e.type==='tasks'||e.type==='goals')&&!e.done)
    .sort((a,b)=>(a.when||'9999')<(b.when||'9999')?-1:1).slice(0,5);
  const todayRows=todays.length?todays.map(e=>{const a=areaById(e.area);const fut=isFuture(e.when);
    return `<div class="home-row"><span class="rdot" style="background:${a?a.color:'var(--faint)'}"></span><span class="rtext">${esc(e.text)}</span>${e.when?`<span class="rwhen ${fut?'future':''}">${relTime(e.when)}</span>`:''}</div>`;
  }).join(''):'<div class="none">Nothing pressing.</div>';

  const dq=dailyQuote();
  const ref=entries.filter(e=>e.type==='reflections'&&!(dq&&e.id===dq.id)).sort((a,b)=>(b.when||b.created).localeCompare(a.when||a.created))[0];

  const toggle=`<div class="home-toggle"><button class="${homeMode==='dashboard'?'on':''}" data-hm="dashboard">Dashboard</button><button class="${homeMode==='journal'?'on':''}" data-hm="journal">Journal</button></div>`;

  const quoteEl=dq?`<div class="daily-quote"><div class="dq-text">${mdRender(dq.text)}</div></div>`:'';

  if(homeMode==='journal'){
    // recent photo memories for a gallery strip
    const photoMems=entries.filter(e=>e.type==='memories'&&e.imgs&&e.imgs.length).sort((a,b)=>(b.when||b.created).localeCompare(a.when||a.created)).slice(0,4);
    const strip=photoMems.length?`<div class="jr-strip">${photoMems.map(m=>`<button class="jr-photo" data-open-mem="${m.id}" style="background-image:url(${disp(m.imgs[0])})"><span class="jr-photo-cap">${esc((m.text||'').slice(0,40))}</span></button>`).join('')}</div>`:'';
    const recentRefs=entries.filter(e=>e.type==='reflections').sort((a,b)=>(b.when||b.created).localeCompare(a.when||a.created)).slice(0,2);
    const refsEl=recentRefs.length?recentRefs.map(r=>`<div class="jr-reflection">${mdRender(r.text.slice(0,400))}${r.text.length>400?'…':''}<div class="jr-rdate">${r.when?relTime(r.when):''}</div></div>`).join(''):'<div class="none">No reflections yet.</div>';
    const tasksGoals=entries.filter(e=>(e.type==='tasks'||e.type==='goals')&&!e.done).sort((a,b)=>(a.when||'9999')<(b.when||'9999')?-1:1).slice(0,6);
    const tgEl=tasksGoals.length?tasksGoals.map(e=>{const a=areaById(e.area);const fut=isFuture(e.when);return `<div class="home-row"><span class="rdot" style="background:${a?a.color:'var(--faint)'}"></span><span class="rtext">${esc(e.text)}</span>${e.when?`<span class="rwhen ${fut?'future':''}">${relTime(e.when)}</span>`:''}</div>`;}).join(''):'<div class="none">Clear for now.</div>';

    $('view').innerHTML=`
      ${quoteEl}
      <div class="home-status">${sub}</div>
      ${dueEl}
      ${strip}
      ${otd?`<div class="onthisday"><div class="od">On this day · ${otd.when.slice(0,4)}</div><div class="oq">"${esc(otd.text.slice(0,260))}${otd.text.length>260?'…':''}"</div></div>`:''}
      <div class="jr-cols">
        <div class="jr-main">
          <div class="home-sec"><div class="sh">Reflections</div>${refsEl}</div>
        </div>
        <div class="jr-aside">
          <div class="home-sec"><div class="sh">On your mind</div>${tgEl}</div>
        </div>
      </div>
      ${toggle}`;
    $('view').querySelectorAll('[data-hm]').forEach(b=>b.onclick=()=>{homeMode=b.dataset.hm;savePrefs();renderHome();});
    $('view').querySelectorAll('[data-open-mem]').forEach(b=>b.onclick=()=>{areaFilter=null;current='memories';render();});
    $('view').querySelectorAll('[data-rdue]').forEach(b=>b.onclick=async(ev)=>{ev.stopPropagation();await toggle(b.dataset.rdue);});
    return;
  }

  $('view').innerHTML=`
    ${quoteEl}
    <div class="home-status">${sub}</div>
    ${dueEl}
    <div class="home-areas">${acards}</div>
    ${otd?`<div class="onthisday"><div class="od">On this day · ${otd.when.slice(0,4)}</div><div class="oq">"${esc(otd.text.slice(0,220))}${otd.text.length>220?'…':''}"</div></div>`:''}
    <div class="home-sec"><div class="sh">On your mind</div>${todayRows}</div>
    ${ref?`<div class="home-sec"><div class="sh">Latest reflection</div><div class="home-row serif"><span class="rtext" style="white-space:normal">${esc(ref.text.slice(0,180))}${ref.text.length>180?'…':''}</span></div></div>`:''}
    ${toggle}
  `;
  $('view').querySelectorAll('[data-hm]').forEach(b=>b.onclick=()=>{homeMode=b.dataset.hm;savePrefs();renderHome();});
  $('view').querySelectorAll('.acard').forEach(c=>c.onclick=()=>{areaFilter=c.dataset.area;pursuitsActive=true;pursuitsSub='tasks';current='tasks';render();});
  $('view').querySelectorAll('[data-rdue]').forEach(b=>b.onclick=async(ev)=>{ev.stopPropagation();await toggle(b.dataset.rdue);});
}

// ---------- TIMELINE ----------
// ===== STUDY TRACKER =====
const UNIT_LABELS={chapters:'chapters',pages:'pages',percent:'%',sessions:'sessions',problems:'problems'};
function studyStreak(){
  // streak of consecutive days with at least one study log
  const days=new Set(entries.filter(e=>e.study||(e.type==='logs'&&(e.tags||[]).includes('study'))).map(e=>e.when||(e.created||'').slice(0,10)).filter(Boolean));
  // also count days where any source's progressLog has an entry
  studySources.forEach(s=>(s.progressLog||[]).forEach(p=>days.add(p.date)));
  if(!days.size)return 0;
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let n=0;const d=new Date();d.setHours(0,0,0,0);
  if(!days.has(iso(d))){d.setDate(d.getDate()-1);if(!days.has(iso(d)))return 0;}
  while(days.has(iso(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
// ===== WELLNESS =====
let wellnessDayOffset=0;
let pursuitsSub='tasks'; // 'tasks' | 'goals'
let pursuitsActive=false;
function wellnessStreak(trackId){
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const has=d=>{const day=wellnessLog[iso(d)];if(!day)return false;const v=day[trackId];return v===true||(typeof v==='number'&&v>0)||(typeof v==='string'&&v);};
  let n=0;const d=new Date();d.setHours(0,0,0,0);
  if(!has(d)){d.setDate(d.getDate()-1);if(!has(d))return 0;}
  while(has(d)){n++;d.setDate(d.getDate()-1);}
  return n;
}
function renderPursuits(){
  pursuitsActive=true;
  current=pursuitsSub;
  renderSection();
  renderNav();
}

function wellnessTrends(target){
  const sleepColor=(WELLNESS_TRACKS.find(t=>t.id==='sleep')||{}).color||'#378ADD';
  const days=[];
  for(let i=0;i<30;i++){const d=new Date(target);d.setDate(d.getDate()-i);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;days.push(wellnessLog[k]||{});}
  const sleeps=days.map(x=>+x.sleep||0);
  const maxS=Math.max(10,...sleeps);
  const W=300,H=66,bw=W/30;
  const bars=sleeps.map((v,i)=>{const h=v?Math.max(2,(v/maxS)*H):0;return `<rect x="${(i*bw+1).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${h.toFixed(1)}" rx="1" fill="${sleepColor}"/>`;}).join('');
  const sv=sleeps.filter(v=>v>0);const avgSleep=sv.length?(sv.reduce((a,b)=>a+b,0)/sv.length).toFixed(1):'—';
  const sleepChart=`<div class="wel-trend-block"><div class="wel-trend-h"><span class="wel-dot-icon" style="background:${sleepColor}"></span> Sleep · avg ${avgSleep} hrs</div><svg viewBox="0 0 ${W} ${H}" class="wel-trend-svg" preserveAspectRatio="none">${bars}</svg></div>`;
  const checkRows=WELLNESS_TRACKS.filter(t=>t.kind==='check').map(t=>{
    const done=days.filter(x=>x[t.id]===true).length;
    const dots=days.map(x=>`<span class="wel-dot ${x[t.id]===true?'on':''}"></span>`).join('');
    return `<div class="wel-trend-block"><div class="wel-trend-h"><span class="wel-dot-icon" style="background:${t.color}"></span> ${t.name} · ${done}/30 days</div><div class="wel-trend-dots">${dots}</div></div>`;
  }).join('');
  return `<div class="wel-trends"><div class="wel-week-h">Last 30 days</div>${sleepChart}${checkRows}</div>`;
}
function renderWellness(){
  const target=new Date();target.setHours(0,0,0,0);target.setDate(target.getDate()+wellnessDayOffset);
  const iso=`${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(target.getDate()).padStart(2,'0')}`;
  const dayLabel=wellnessDayOffset===0?'Today':wellnessDayOffset===-1?'Yesterday':target.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const day=wellnessLog[iso]||{};

  const dayNav=`<div class="log-daynav">
    <button id="welPrev" title="previous day">‹</button>
    <span class="log-daylabel">${dayLabel}<span class="log-daydate">${target.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span></span>
    <button id="welNext" ${wellnessDayOffset>=0?'disabled':''} title="next day">›</button>
  </div>`;

  const cards=WELLNESS_TRACKS.map(t=>{
    const streak=wellnessStreak(t.id);
    const streakEl=streak>0?`<span class="wel-streak">${streak}d streak</span>`:'';
    let control='';
    let checkbox='';
    if(t.kind==='check'){
      const on=day[t.id]===true;
      checkbox=`<button class="wel-checkbox ${on?'on':''}" data-wel-check="${t.id}" style="${on?`background:${t.color};border-color:${t.color}`:''}" title="${on?'done today':'mark done'}" aria-label="${t.name} done">${on?'✓':''}</button>`;
    }else if(t.kind==='hours'){
      const v=day[t.id]||'';
      control=`<div class="wel-control"><div class="wel-hours"><button data-wel-h="${t.id}" data-d="-0.5">−</button><input class="wel-hin" data-wel-hin="${t.id}" type="number" step="0.5" min="0" max="24" placeholder="—" value="${v}"><button data-wel-h="${t.id}" data-d="0.5">+</button><span class="wel-unit">hrs</span></div></div>`;
    }
    const note=day[t.id+'_note']||'';
    const noteEl=`<input class="wel-note" data-wel-note="${t.id}" placeholder="add detail…" value="${esc(note)}">`;
    let nutritionEl='';
    if(t.id==='diet'){
      const cal=day.calories,pro=day.protein;
      const stats=(cal!=null||pro!=null)?`<div class="diet-stats">${cal!=null?`<span class="ds"><b>${cal}</b> cal</span>`:''}${pro!=null?`<span class="ds"><b>${pro}</b>g protein</span>`:''}</div>`:'';
      nutritionEl=`${stats}<input class="wel-note" data-diet-goal placeholder="🎯 Diet goal (e.g. ≥150g protein, no late snacking)" value="${esc(dietGoal)}"><button class="diet-scan" data-diet-scan title="scan a nutrition screenshot"><svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke="currentColor" style="width:14px;height:14px;vertical-align:-2px;margin-right:5px"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Scan screenshot</button>`;
    }
    return `<div class="wel-card" style="border-left:3px solid ${t.color}">
      <div class="wel-top"><span class="wel-dot-icon" style="background:${t.color}"></span><span class="wel-name">${t.name}</span>${streakEl}${checkbox}<button class="wel-hist-btn" data-wel-hist="${t.id}" title="history">⋯</button></div>
      ${control}
      ${nutritionEl}
      ${noteEl}
    </div>`;
  }).join('');

  // weekly dots for each track
  const weekStrip=`<div class="wel-week"><div class="wel-week-h">Last 7 days</div>${WELLNESS_TRACKS.map(t=>{
    let dots='';
    for(let i=0;i<=6;i++){const d=new Date(target);d.setDate(d.getDate()-i);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const dd=wellnessLog[k]||{};const v=dd[t.id];const on=v===true||(typeof v==='number'&&v>0)||(typeof v==='string'&&v);
      dots+=`<span class="wel-dot ${on?'on':''}" title="${k}"></span>`;}
    return `<div class="wel-week-row"><span class="wel-week-lbl"><span class="wel-dot-icon" style="background:${t.color}"></span> ${t.name}</span><span class="wel-week-dots">${dots}</span></div>`;

// AI: from a log brain-dump, detect progress mentions against known sources
async function detectStudyProgress(text){
  if(!studySources.length)return null;
  const list=studySources.map(s=>`{"id":"${s.id}","name":"${s.name}","unit":"${s.unit}","current":${s.current||0}}`).join(', ');
  try{
    const res=await fetch("/.netlify/functions/anthropic",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:300,
        messages:[{role:"user",content:`Known study sources: [${list}]. From this log, detect any mention of progress through these sources and return the NEW current value (e.g. "read Robbins ch 14" -> value 14 for the chapters unit; "did 30 more uworld" -> add to current). Only include sources actually mentioned. Reply with ONLY a JSON array like [{"id":"...","value":14}], or [] if none.\n\nLog: """${text.slice(0,1500)}"""`}]})
    });
    const data=await res.json();let t=(data.content||[]).map(b=>b.type==='text'?b.text:'').join('').trim().replace(/```json|```/g,'').trim();
    const arr=JSON.parse(t);const ids=new Set(studySources.map(s=>s.id));
    return (Array.isArray(arr)?arr:[]).filter(o=>ids.has(o.id)&&typeof o.value==='number');
  }catch(e){console.warn('study detect failed',e);return null;}
}

// Which calendar day an entry belongs to in the Log (null = it shouldn't appear).
// The Log is a RECORD of what happened: unfinished to-do tasks are hidden; a completed
// task surfaces automatically on the day it was completed.
function logDate(e){
  if(e.type==='tasks'){
    if(e.every)return e.lastDone||null;                    // recurring chore: the day it was last done
    if(!e.done)return null;                                // unfinished to-do: never shows in the log
    return e.doneAt||e.when||(e.created||'').slice(0,10);  // completed: the day it was completed
  }
  return e.when||(e.created||'').slice(0,10);
}

function wireLogs(){

  if($('logSort'))$('logSort').onclick=async()=>{

    const combinedText=logProposed.map(it=>it.text).join('. ');
    logProposed.forEach(it=>{if(!it.text.trim())return;
      const txt=it.text.trim();

      if(it.type==='logs'){
        const existing=entries.find(e=>e.type==='logs'&&e.area===it.area&&(e.when===iso)&&!e.title);
        if(existing){
          existing.text=existing.text.trim()+'\n• '+txt;
          existing.tags=[...new Set([...(existing.tags||[]),...(it.tags||[])])];
          return;
        }
      }
      entries.push({id:uid(),type:it.type,area:it.area,title:null,text:(it.type==='logs'?'• ':'')+txt,source:it.type==='knowledge'?'field':null,meta:it.type==='knowledge'?{}:null,
        tags:it.tags||[],when:iso,imgs:[],links:[],done:false,created:new Date().toISOString()});

    logProposed=null;logDraft='';await saveEntries();renderLogs();

    // detect wellness check-ins from the log for this day
    detectWellness(combinedText,dietGoal).then(w=>{if(w&&Object.keys(w).length){wellnessLog[iso]=Object.assign({},wellnessLog[iso]||{},w);saveWellness();const ind=document.querySelector('[data-k="wellness"]');if(ind&&current!=='wellness')ind.classList.add('has-badge');}});
  };

async function detectWellness(text,goal){
  try{
    const res=await fetch("/.netlify/functions/anthropic",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:300,
        messages:[{role:"user",content:`From this daily log, extract wellness info. Return ONLY a JSON object. Possible keys:\n"fitness": {"done":true, "note":"brief description of the workout"} if they exercised\n"diet": {"done":true_or_false, "note":"brief description of what/how they ate"} — include if any food/diet is mentioned, but set "done" true ONLY if the eating clearly MEETS the user's diet goal${goal?` ("${goal}")`:` (no goal set, so use false)`}; merely logging food does NOT count as meeting the goal\n"sleep": {"hours":number, "note":"brief sleep description"} if sleep mentioned\nOmit any key with no signal. Keep notes concise (under 12 words). Reply with ONLY the JSON object.\n\nLog: """${text.slice(0,1500)}"""`}]})
    });
    const data=await res.json();let t=(data.content||[]).map(b=>b.type==='text'?b.text:'').join('').trim().replace(/```json|```/g,'').trim();
    const o=JSON.parse(t);const out={};
    if(o.fitness&&o.fitness.done){out.fitness=true;if(o.fitness.note)out.fitness_note=String(o.fitness.note).slice(0,120);}
    if(o.diet){if(o.diet.done)out.diet=true;if(o.diet.note)out.diet_note=String(o.diet.note).slice(0,120);}
    if(o.sleep&&typeof o.sleep.hours==='number'&&o.sleep.hours>0&&o.sleep.hours<=24){out.sleep=o.sleep.hours;if(o.sleep.note)out.sleep_note=String(o.sleep.note).slice(0,120);}
    return out;
  }catch(e){console.warn('wellness detect failed',e);return null;}
}
// vision: read calories + protein from a nutrition-app screenshot (base64 data URL)
async function extractNutrition(dataUrl){
  try{
    const m=dataUrl.match(/^data:(image\/\w+);base64,(.+)$/);if(!m)return null;
    const res=await fetch("/.netlify/functions/anthropic",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:150,
        messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type:m[1],data:m[2]}},
          {type:"text",text:`This is a screenshot from a nutrition tracking app. Read the daily TOTAL calories and total protein (grams). Reply with ONLY a JSON object like {"calories":2100,"protein":180}. If a value isn't visible, use null. No other text.`}
        ]}]})
    });
    const data=await res.json();let t=(data.content||[]).map(b=>b.type==='text'?b.text:'').join('').trim().replace(/```json|```/g,'').trim();
    const o=JSON.parse(t);
    return {calories:(typeof o.calories==='number'?o.calories:null),protein:(typeof o.protein==='number'?o.protein:null)};
  }catch(e){console.warn('nutrition extract failed',e);return null;}
}
// transcribe a handwritten note image to markdown text
async function transcribeHandwriting(dataUrl){
  try{
    const m=dataUrl.match(/^data:(image\/\w+);base64,(.+)$/);if(!m)return null;
    const res=await fetch("/.netlify/functions/anthropic",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1500,
        messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type:m[1],data:m[2]}},
          {type:"text",text:`Transcribe this handwritten note into clean text. Preserve structure: use Markdown — # for headings, - for bullet points, **bold** for emphasized/underlined terms. Keep medical terms, abbreviations, numbers and dosages exact. If a word is illegible, write [?]. Output ONLY the transcribed note in Markdown, nothing else.`}
        ]}]})
    });
    const data=await res.json();let t=(data.content||[]).map(b=>b.type==='text'?b.text:'').join('').trim();
    t=t.replace(/^```(?:markdown)?\n?/,'').replace(/```$/,'').trim();
    return t||null;
  }catch(e){console.warn('transcribe failed',e);return null;}
}

// Month calendar showing when tasks are due (non-recurring by due date; recurring on next-due; other dated entries as a dot).
function renderCalendarInner(viewToggle){
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const now=new Date();now.setHours(0,0,0,0);
  const base=new Date(now.getFullYear(),now.getMonth()+calMonthOffset,1);
  const y=base.getFullYear(),mo=base.getMonth();
  const monthLabel=base.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const firstDow=base.getDay(),daysInMonth=new Date(y,mo+1,0).getDate(),todayISOv=iso(now);
  const byDay={};const push=(k,it)=>{if(k)(byDay[k]=byDay[k]||[]).push(it);};
  entries.forEach(e=>{
    if(areaFilter&&e.area!==areaFilter)return;
    if(e.type==='tasks'){
      if(e.every){const nd=e.lastDone?(()=>{const d=new Date(e.lastDone+'T00:00:00');d.setDate(d.getDate()+(+e.every||1));return iso(d);})():todayISOv;push(nd,{e,recurring:true});}
      else if(e.when)push(e.when,{e,done:!!e.done});
    } else if(e.when)push(e.when,{e,other:true});
  });
  let html=(viewToggle||'')+areaStripHTML();
  html+=`<div class="cal-nav"><button data-calnav="-1" title="previous month">‹</button><span class="cal-title">${monthLabel}</span><button data-calnav="1" title="next month">›</button>${calMonthOffset!==0?`<button data-calnav="0" class="cal-today">Today</button>`:''}</div>`;
  html+=`<div class="cal-grid">`+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++)html+=`<div class="cal-cell empty"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const k=iso(new Date(y,mo,day));const items=byDay[k]||[];
    const tasks=items.filter(it=>!it.other),others=items.filter(it=>it.other);
    const chips=tasks.slice(0,3).map(it=>{
      const ov=!it.done&&!it.recurring&&k<todayISOv;
      const col=ov?'#c0392b':(it.e.priority==='high'?'#c0392b':it.e.priority==='med'?'#c47f17':((areaById(it.e.area)||{}).color||'var(--accent)'));
      return `<div class="cal-chip${it.done?' done':''}" data-go="${it.e.id}" style="border-left:3px solid ${col}" title="${esc(it.e.text)}">${it.recurring?'🔁 ':''}${esc((it.e.text||'').slice(0,22))}</div>`;
    }).join('');
    const more=tasks.length>3?`<div class="cal-more">+${tasks.length-3} more</div>`:'';
    const dot=others.length?`<span class="cal-dot" title="${others.length} other entr${others.length>1?'ies':'y'} this day"></span>`:'';
    html+=`<div class="cal-cell${k===todayISOv?' today':''}"><div class="cal-daynum">${day}${dot}</div>${chips}${more}</div>`;
  }
  html+=`</div><div class="cal-legend">Tap a task to open it · 🔁 recurring · red = overdue</div>`;
  $('view').innerHTML=html;wireAreaStrip();
  $('view').querySelectorAll('[data-logview]').forEach(b=>b.onclick=()=>{logView=b.dataset.logview;renderLogs();});
  $('view').querySelectorAll('[data-calnav]').forEach(b=>b.onclick=()=>{const v=b.dataset.calnav;calMonthOffset=(v==='0')?0:calMonthOffset+(+v);renderLogs();});
  $('view').querySelectorAll('.cal-chip[data-go]').forEach(c=>c.onclick=()=>gotoEntry(c.dataset.go));
}

// ----- goal hierarchy + habit streaks -----
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function streakOf(e){
  const log=e.habitLog||[];if(!log.length)return 0;
  const set=new Set(log);let n=0;const d=new Date();d.setHours(0,0,0,0);
  // allow streak to count from today or yesterday
  const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  if(!set.has(iso(d))){d.setDate(d.getDate()-1);if(!set.has(iso(d)))return 0;}
  while(set.has(iso(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function goalsListHTML(items){
  if(!items.length)return `<div class="empty"><div class="mark">∅</div><p>No goals yet. Add a big-picture goal, then break it into sub-goals and daily habits.</p></div>`;
  const parents=items.filter(e=>!e.parent);
  const childrenOf=id=>items.filter(e=>e.parent===id);
  const orphans=items.filter(e=>e.parent&&!items.find(p=>p.id===e.parent));
  const render=(e,depth)=>{
    const kids=childrenOf(e.id);
    const done=kids.filter(k=>k.done).length;
    const prog=kids.length?`<span class="goal-prog">${done}/${kids.length}</span>`:'';
    const a=areaById(e.area);
    const isHabit=e.habit;
    const streak=isHabit?streakOf(e):0;
    const doneToday=isHabit&&(e.habitLog||[]).includes(todayISO());
    const habitBtn=isHabit?`<button class="habit-check ${doneToday?'on':''}" data-habit="${e.id}" title="${doneToday?'done today':'mark done today'}">${doneToday?'✓':'○'}</button>`:'';
    const streakEl=isHabit&&streak>0?`<span class="goal-streak">🔥 ${streak}d</span>`:'';
    const check=!isHabit?`<button class="goal-check ${e.done?'on':''}" data-gdone="${e.id}">${e.done?'✓':''}</button>`:'';
    return `<div class="goal-node depth-${Math.min(depth,3)}" style="${a?`--gc:${a.color}`:''}">
      <div class="goal-row ${e.done?'done':''}">
        ${habitBtn||check}
        <span class="goal-text">${esc(e.text)}</span>
        ${streakEl}${prog}
        ${a?`<span class="goal-area" style="color:${a.color}">${esc(a.name)}</span>`:''}
        <span class="goal-acts">
          <button data-gadd="${e.id}" title="add sub-goal">＋</button>

        </span>

    </div>`;
  };
  return `<div class="goals-tree">${parents.map(p=>render(p,0)).join('')}${orphans.map(o=>render(o,0)).join('')}</div>`;
}

function mdAction(kind){
  captureDraft();
  if(kind==='preview'){previewOn=!previewOn;renderSection();return;}
  if(kind==='collapse'){toolbarMin=true;renderSection();return;}
  if(kind==='expand'){toolbarMin=false;renderSection();return;}
  const ta=$('input');if(!ta)return;
  const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value,sel=v.slice(s,e);
  const wrap=(pre,post=pre,ph='text')=>{const t=sel||ph;ta.value=v.slice(0,s)+pre+t+post+v.slice(e);ta.focus();ta.setSelectionRange(s+pre.length,s+pre.length+t.length);};
  const line=(pre)=>{const t=sel||'item';ta.value=v.slice(0,s)+pre+t+v.slice(e);ta.focus();};
  if(kind==='bold')wrap('**');
  else if(kind==='italic')wrap('*');
  else if(kind==='hl')wrap('==');
  else if(kind==='code')wrap('`','`','code');
  else if(kind==='h')line('## ');
  else if(kind==='ul')line('- ');
  else if(kind==='ol')line('1. ');
  else if(kind==='quote')line('> ');
  else if(kind==='link'){const t=sel||'text';ta.value=v.slice(0,s)+`[${t}](url)`+v.slice(e);ta.focus();}
  draft.text=ta.value;
  ta.dispatchEvent(new Event('input'));
}

// cheap change magnitude: difference in length + char-level mismatch sample
function levenshteinish(a,b){

function wsMd(kind){

  const s=ta.selectionStart,en=ta.selectionEnd,v=ta.value,sel=v.slice(s,en);
  const wrap=(p,q=p,ph='text')=>{const t=sel||ph;ta.value=v.slice(0,s)+p+t+q+v.slice(en);ta.focus();ta.setSelectionRange(s+p.length,s+p.length+t.length);};
  const line=p=>{ta.value=v.slice(0,s)+p+(sel||'item')+v.slice(en);ta.focus();};
  if(kind==='bold')wrap('**');else if(kind==='italic')wrap('*');else if(kind==='hl')wrap('==');
  else if(kind==='code')wrap('`','`','code');
  else if(kind==='h1'||kind==='h')line('# ');else if(kind==='h2')line('## ');
  else if(kind==='ul')line('- ');else if(kind==='ol')line('1. ');else if(kind==='quote')line('> ');
  else if(kind==='link'){ta.value=v.slice(0,s)+`[${sel||'text'}](url)`+v.slice(en);ta.focus();}

// ---- recurring tasks (a task with `every` = N days repeats; `lastDone` tracks the last completion) ----
function recurDueDays(e){ // days until next due; <=0 means due/overdue; null if not recurring
  if(!(e&&e.type==='tasks'&&e.every))return null;
  if(!e.lastDone)return 0; // never done -> due now
  const last=new Date(e.lastDone+'T00:00:00'),due=new Date(last);due.setDate(due.getDate()+(+e.every||1));
  const today=new Date(todayISO()+'T00:00:00');
  return Math.round((due-today)/864e5);
}
function dueRecurring(){return entries.filter(e=>e.type==='tasks'&&e.every&&!e.done&&recurDueDays(e)<=0).sort((a,b)=>recurDueDays(a)-recurDueDays(b));}
async function toggle(id){const e=entries.find(x=>x.id===id);if(!e)return;
  if(e.type==='tasks'&&e.every){ // recurring: mark done now, reschedule instead of removing

    showToast('Done — next due in '+e.every+' day'+(e.every>1?'s':''),'',null);return;
  }
  e.done=!e.done;if(e.type==='tasks')e.doneAt=e.done?todayISO():null;e._mod=Date.now();render();await saveEntries();}

function parseImport(raw,split){
  // strip simple YAML front-matter, collect its tags
  let fmTags=[];
  raw=raw.replace(/^---\n([\s\S]*?)\n---\n?/,(_,fm)=>{const t=fm.match(/tags?:\s*\[([^\]]*)\]/i)||fm.match(/tags?:\s*(.+)/i);if(t)fmTags=t[1].split(/[,\s]+/).map(x=>x.replace(/['"#]/g,'').trim()).filter(Boolean);return'';});
  const hashTags=s=>{const m=s.match(/#[\w-]+/g)||[];return m.map(x=>x.slice(1));};
  if(!split)return[{title:'',body:raw.trim(),tags:[...new Set([...fmTags,...hashTags(raw)])],chapter:''}];
  const lines=raw.split('\n');const notes=[];let cur=null;
  for(const line of lines){
    const h=line.match(/^(#{1,3})\s+(.+)/);
    if(h){if(cur)notes.push(cur);cur={title:h[2].trim(),body:'',tags:fmTags.slice(),chapter:''};}
    else if(cur){cur.body+=(cur.body?'\n':'')+line;}
    else if(line.trim()){cur={title:'',body:line,tags:fmTags.slice(),chapter:''};}
  }
  if(cur)notes.push(cur);
  notes.forEach(n=>{n.tags=[...new Set([...n.tags,...hashTags(n.body)])];n.body=n.body.trim();});
  return notes.filter(n=>n.title||n.body);
}

function colorOf(e){return graphColorBy==='area'?((areaById(e.area)||{}).color||'#888780'):SOURCE_COLORS[e.source||'field'];}
function drawGraph(notes){
  const box=$('graphbox');if(!box)return;
  box.innerHTML='';
  if(!notes.length){box.innerHTML='<div class="empty" style="height:100%;display:flex;align-items:center;justify-content:center"><p>No notes yet. Create and link some notes to see the graph.</p></div>';return;}
  const run=()=>{
    box.innerHTML='';
    const W=box.clientWidth,H=box.clientHeight;
    const ids=new Set(notes.map(n=>n.id));
    const nodes=notes.map(n=>({id:n.id,label:n.title||n.text.slice(0,24),deg:0,ref:n}));
    const nmap={};nodes.forEach(n=>nmap[n.id]=n);
    const links=[];const seen=new Set();
    notes.forEach(n=>(n.links||[]).forEach(t=>{if(ids.has(t)){const key=[n.id,t].sort().join('|');if(!seen.has(key)){seen.add(key);links.push({source:n.id,target:t});nmap[n.id].deg++;if(nmap[t])nmap[t].deg++;}}}));
    const svg=d3.select(box).append('svg').attr('width',W).attr('height',H);
    const g=svg.append('g');
    svg.call(d3.zoom().scaleExtent([0.3,3]).on('zoom',ev=>g.attr('transform',ev.transform)));
    const sim=d3.forceSimulation(nodes)
      .force('link',d3.forceLink(links).id(d=>d.id).distance(90))
      .force('charge',d3.forceManyBody().strength(-220))
      .force('center',d3.forceCenter(W/2,H/2))
      .force('collide',d3.forceCollide(28));
    const link=g.append('g').attr('stroke','#c4c1b8').attr('stroke-opacity',0.55).selectAll('line').data(links).join('line').attr('stroke-width',1.2);
    const node=g.append('g').selectAll('g').data(nodes).join('g').style('cursor','pointer')
      .call(d3.drag().on('start',(ev,d)=>{if(!ev.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
        .on('drag',(ev,d)=>{d.fx=ev.x;d.fy=ev.y;})
        .on('end',(ev,d)=>{if(!ev.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
    node.append('circle').attr('r',d=>7+Math.min(d.deg*2.2,12)).attr('fill',d=>colorOf(d.ref)).attr('stroke','#fff').attr('stroke-width',1.5);
    node.append('text').text(d=>d.label).attr('x',0).attr('y',d=>18+Math.min(d.deg*2.2,12)).attr('text-anchor','middle').attr('font-size','11px').attr('fill','#5f5e5a').attr('font-family','Inter,sans-serif').style('pointer-events','none');
    node.on('click',(ev,d)=>{ev.stopPropagation();gotoEntry(d.id);});
    sim.on('tick',()=>{
      link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      node.attr('transform',d=>`translate(${d.x},${d.y})`);
    });
  };
  if(window.d3){run();}
  else{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js';s.onload=run;s.onerror=()=>{box.innerHTML='<div class="empty"><p>Couldn\'t load the graph library (needs a connection).</p></div>';};document.head.appendChild(s);}
}

let _uid=null;
// Local-first storage (same get/set shape the app already uses).
// Writes save to a local cache instantly (works fully offline) AND to Supabase
// when online; if offline, the key is queued ("dirty") and synced on reconnect.
// Reads use Supabase when online, falling back to the local cache offline or for
// keys with unsynced local edits (so offline edits are never lost or overwritten).
const _CK=k=>'cache:'+(_uid||'anon')+':'+k;
const _DKEY=()=>'dirty:'+(_uid||'anon');
function _getDirty(){try{return new Set(JSON.parse(localStorage.getItem(_DKEY())||'[]'));}catch(e){return new Set();}}
function _setDirty(s){try{localStorage.setItem(_DKEY(),JSON.stringify([...s]));}catch(e){}}
function _markDirty(k){const s=_getDirty();s.add(k);_setDirty(s);updateOfflineUI();}
function _clearDirty(k){const s=_getDirty();s.delete(k);_setDirty(s);updateOfflineUI();}
async function _sbGet(k){const{data,error}=await _sb.from('store').select('value').eq('key',k).maybeSingle();if(error)throw error;return data&&data.value!=null?data.value:null;}
async function _sbSet(k,v){const{error}=await _sb.from('store').upsert({user_id:_uid,key:k,value:v,updated_at:new Date().toISOString()},{onConflict:'user_id,key'});if(error)throw error;}
function _cloudStorage(){
  return {
    get: async (k)=>{
      if(_getDirty().has(k)){const c=localStorage.getItem(_CK(k));return c!=null?{value:c}:null;} // unsynced local edit wins
      if(navigator.onLine){try{const v=await _sbGet(k);if(v!=null){try{localStorage.setItem(_CK(k),v);}catch(e){}}return v!=null?{value:v}:null;}catch(e){}}
      const c=localStorage.getItem(_CK(k));return c!=null?{value:c}:null;
    },
    set: async (k,v)=>{
      try{localStorage.setItem(_CK(k),v);}catch(e){}        // persist locally first (offline-safe)
      if(navigator.onLine){try{await _sbSet(k,v);_clearDirty(k);return;}catch(e){}}
      _markDirty(k);                                        // offline or failed -> queue for sync
    }
  };
}
// Sync offline edits by MERGING with the cloud (item-level, newest-wins) rather
// than overwriting — so changes made on another device aren't clobbered.
async function _syncDirty(){
  if(!navigator.onLine||!_sb||!_uid)return false;
  const dirty=_getDirty();if(!dirty.size)return false;
  const parse=s=>{try{return s?JSON.parse(s):null;}catch(e){return null;}};
  const localOf=k=>parse(localStorage.getItem(_CK(k)));
  const arrKeys=['repo:entries','repo:areas','repo:study','repo:trash','repo:car','repo:tolearn'];
  const allKeys=[...arrKeys,'repo:wellness','repo:prefs'];
  const cloud={};
  for(const k of allKeys){try{cloud[k]=parse(await _sbGet(k));}catch(e){cloud[k]=null;}}
  // union by id; on id conflict keep the item with the newer _mod (fallback: local)
  const mergeArr=(a,b)=>{const m={};(b||[]).forEach(x=>{if(x&&x.id!=null)m[x.id]=x;});(a||[]).forEach(x=>{if(x&&x.id!=null){const e=m[x.id];if(!e||((x._mod||0)>=(e._mod||0)))m[x.id]=x;}});return Object.values(m);};
  const final={};
  arrKeys.forEach(k=>{final[k]=dirty.has(k)?mergeArr(localOf(k),cloud[k]):(cloud[k]||localOf(k)||[]);});
  final['repo:wellness']=dirty.has('repo:wellness')?Object.assign({},cloud['repo:wellness']||{},localOf('repo:wellness')||{}):(cloud['repo:wellness']||localOf('repo:wellness')||{});
  final['repo:prefs']=dirty.has('repo:prefs')?(localOf('repo:prefs')||cloud['repo:prefs']):(cloud['repo:prefs']||localOf('repo:prefs'));
  // a deletion on either device wins (trashed ids removed from the active list; still recoverable in Trash)
  const trashIds=new Set((final['repo:trash']||[]).map(x=>x&&x.id).filter(Boolean));
  final['repo:entries']=(final['repo:entries']||[]).filter(x=>x&&!trashIds.has(x.id));
  for(const k of allKeys){
    if(final[k]==null)continue;
    const v=JSON.stringify(final[k]);
    try{localStorage.setItem(_CK(k),v);}catch(e){}
    if(dirty.has(k)){try{await _sbSet(k,v);_clearDirty(k);}catch(e){}}
  }
  entries=final['repo:entries']||entries;
  if(final['repo:areas']&&final['repo:areas'].length)areas=final['repo:areas'];
  studySources=final['repo:study']||studySources;
  trash=final['repo:trash']||trash;
  if(final['repo:car'])carRecords=final['repo:car'];
  if(final['repo:tolearn'])learnList=final['repo:tolearn'];
  if(final['repo:wellness'])wellnessLog=final['repo:wellness'];
  const pr=final['repo:prefs'];if(pr){homeMode=pr.homeMode||homeMode;wsFontScale=pr.wsFontScale||wsFontScale;theme=pr.theme||theme;}
  if(typeof render==='function'&&!(typeof composerOpen!=='undefined'&&composerOpen))render();
  return true;
}
function updateOfflineUI(){
  const el=document.getElementById('offlineBar');if(!el)return;

  else if(pending){el.textContent='Syncing '+pending+' change'+(pending>1?'s':'')+'…';el.style.display='block';}
  else{el.style.display='none';}
}

// boot — single password gate; only start the app once signed in
(async()=>{
  const M=document.getElementById('authMsg');
  if(!_sb){ M.style.color='#c0392b'; M.textContent='Could not load the login system. Check your connection and refresh.'; return; }
  const P=document.getElementById('authPass'), enterBtn=document.getElementById('authEnter'), tog=document.getElementById('authToggle');
  // Show / hide password toggle (helps on phones, where you can't see what you typed).
  if(tog){ tog.onclick=()=>{ const show=P.type==='password'; P.type=show?'text':'password'; tog.textContent=show?'🙈':'👁'; tog.title=tog.ariaLabel=show?'Hide password':'Show password'; P.focus(); }; }
  let busy=false;
  // Never let a hung network request leave us stuck on "Checking…" forever.
  const NET_TIMEOUT=15000;
  const withTimeout=(p)=>Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),NET_TIMEOUT))]);
  const netFail=()=>{ busy=false; M.style.color='#c0392b'; M.textContent='Couldn’t reach the server — check your connection, refresh the page, and try again.'; };
  async function attempt(){
    if(busy) return;
    const pass=P.value;
    if(!pass){ M.style.color='#c0392b'; M.textContent='Please enter your password.'; return; }
    busy=true; M.style.color='#8a8780'; M.textContent='Checking…';
    // First, try to log in to the existing account.
    let res;
    try{ res = await withTimeout(_sb.auth.signInWithPassword({ email:SB_EMAIL, password:pass })); }
    catch(e){ netFail(); return; }
    if(!res.error){ _startApp(); return; }
    // No existing login — treat as first-time setup: create the single account with this password.
    let su;
    try{ su = await withTimeout(_sb.auth.signUp({ email:SB_EMAIL, password:pass })); }
    catch(e){ netFail(); return; }
    if(su.error){
      busy=false;
      if(/registered|already|exists/i.test(su.error.message)){ M.style.color='#c0392b'; M.textContent='Incorrect password.'; }
      else { M.style.color='#c0392b'; M.textContent=su.error.message; }
      return;
    }
    if(su.data.session){ _startApp(); return; }       // first-time setup complete, logged straight in
    busy=false; M.style.color='#c0392b'; M.textContent='Almost there — turn off "Confirm email" in Supabase, then try again.';
  }
  enterBtn.onclick=attempt;
  P.addEventListener('keydown',e=>{ if(e.key==='Enter') attempt(); });
  const { data:{ session } } = await _sb.auth.getSession();
  if(session){ _startApp(); }
})();
