<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vedya</title>
<style>
  :root{
    --bg:#faf9f6; --surface:#ffffff; --ink:#1f1d1a; --muted:#8a8780;
    --faint:#c4c1b8; --line:#e8e5dd; --accent:#3a5a40; --accent-soft:#eef2ec;
    --done:#a3a09a; --radius:14px;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --serif:'Newsreader',Georgia,serif;
  }
  html.dark{
    --bg:#1b1a16; --surface:#242320; --ink:#ece9e1; --muted:#9c988e;
    --faint:#56524a; --line:#34312b; --accent:#8fb596; --accent-soft:#262e27;
    --done:#6f6b62;
  }
  html.dark #acctBar button{background:rgba(40,38,34,.92)!important;color:#9c988e!important;border-color:#34312b!important}
  html,body{transition:background-color .2s ease,color .2s ease}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55}
  .app{max-width:780px;margin:0 auto;padding:0 24px 120px}

  header{padding:36px 0 10px;text-align:center}
  header .date{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;cursor:pointer;display:inline-block}
  header .date:hover{color:var(--ink)}
  header h1{font-family:var(--serif);font-weight:500;font-size:44px;letter-spacing:-.01em;line-height:1;cursor:pointer}
  header .sub{font-family:var(--serif);font-size:26px;color:var(--ink);margin-top:2px}

  nav{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;position:sticky;top:10px;z-index:20;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;margin:0 auto 22px;width:fit-content;max-width:100%;
    box-shadow:0 2px 12px -8px rgba(0,0,0,.15)}
  nav button{font-family:var(--sans);font-size:13.5px;color:var(--muted);background:none;border:none;cursor:pointer;
    padding:7px 14px;border-radius:11px;transition:.18s}
  nav button:hover{color:var(--ink)}
  nav button.on{background:var(--ink);color:var(--bg)}

  /* area filter strip */
  .areastrip{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
  .areastrip button{font-size:12.5px;background:none;border:1px solid var(--line);border-radius:100px;padding:5px 13px;cursor:pointer;
    color:var(--muted);transition:.15s;display:flex;align-items:center;gap:6px}
  .areastrip button:hover{border-color:var(--faint);color:var(--ink)}
  .areastrip button.on{border-color:transparent;color:#fff}
  .areastrip .dot{width:8px;height:8px;border-radius:50%}
  .areastrip .manage{color:var(--faint);border-style:dashed}

  .searchwrap{position:relative;margin:0 0 20px}
  .searchwrap input{width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:100px;padding:11px 16px 11px 40px;outline:none;transition:.18s}
  .searchwrap input:focus{border-color:var(--faint)}
  .searchwrap input::placeholder{color:var(--faint)}
  .searchwrap svg{position:absolute;left:15px;top:12px;width:15px;height:15px;stroke:var(--faint);fill:none}

  .newbtn{width:100%;text-align:left;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
    padding:15px 18px;margin-bottom:24px;cursor:pointer;font-family:var(--sans);font-size:15px;color:var(--muted);transition:.15s}
  .newbtn:hover{border-color:var(--faint);color:var(--ink)}
  .composer-row{display:flex;gap:10px;margin-bottom:24px}
  .composer-row .newbtn{margin-bottom:0}
  .newbtn.alt{width:auto;flex:none;text-align:center;border-style:solid;color:var(--accent)}
  .composer-wrap{position:relative;margin-bottom:24px}
  .comp-top{display:flex;align-items:center;gap:8px;padding:4px 8px 0}
  .comp-top .titlein{flex:1}
  .opt-toggle{font-size:12.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
  .opt-toggle:hover{border-color:var(--faint);color:var(--ink)}
  .mdbar{display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);margin:2px 6px 0;flex-wrap:wrap}
  .mdbar button{min-width:30px;height:28px;border:none;background:none;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted);font-family:var(--serif)}
  .mdbar button:hover{background:var(--bg);color:var(--ink)}
  .mdbar .mdspace{flex:1}
  .mdbar .prevtoggle{font-family:var(--sans);font-size:12px;padding:0 12px;color:var(--accent)}
  .mdbar .prevtoggle.on{background:var(--accent-soft)}
  .mdbar .mdexpand{font-family:var(--sans);font-size:12px;color:var(--muted);min-width:auto;padding:0 8px}
  .mdbar.mini{border-bottom:1px solid var(--line);justify-content:flex-end}
  .editing-tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:100px;margin:4px 0 0 10px}
  .entry .acts .edit:hover{color:var(--accent)}
  .comp-foot{display:flex;align-items:center;gap:8px;padding:6px 10px 4px}
  .photo-btn{font-family:var(--sans);font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 14px;cursor:pointer;transition:.15s}
  .photo-btn:hover{border-color:var(--faint);color:var(--ink)}
  .memdate{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
  .memdate input[type=date]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;font-family:var(--sans);outline:none;color:var(--ink)}
  .ghost{font-size:14px;background:none;border:none;color:var(--muted);cursor:pointer;padding:9px 14px;border-radius:9px}
  .ghost:hover{color:var(--ink);background:var(--bg)}
  .preview{margin:6px 14px;padding:12px 14px;background:var(--bg);border-radius:10px;min-height:60px}
  .preview.hide{display:none}
  .optpanel{position:absolute;top:calc(100% + 8px);right:0;width:280px;max-width:100%;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px;z-index:25;box-shadow:0 14px 40px -16px rgba(0,0,0,.3);
    transform:translateY(-6px);opacity:0;pointer-events:none;transition:.18s}
  .optpanel.open{transform:translateY(0);opacity:1;pointer-events:auto}
  .opt-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500;margin-bottom:10px}
  .opt-x{background:none;border:none;color:var(--faint);cursor:pointer;font-size:14px}
  .opt-l{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:10px 0 4px}
  .optpanel select,.optpanel input[type=date],.optpanel .tagin{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px;font-family:var(--sans);outline:none}
  .opt-acts{display:flex;gap:6px;margin-top:14px}
  .md-h{font-family:var(--serif);font-weight:500;margin:10px 0 4px;line-height:1.25}
  h3.md-h{font-size:18px;color:var(--accent)}h4.md-h{font-size:16px;color:var(--accent);opacity:.85}h5.md-h{font-size:15px}h6.md-h{font-size:14px;color:var(--muted)}
  .md mark,.text.md mark,.md-p mark,.md-h mark,li mark{background:var(--accent-soft);color:var(--ink);padding:0 .2em;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .md-p{margin:6px 0}
  .md-ul,.md-ol{margin:6px 0 6px 20px}
  .md-ul li,.md-ol li{margin:2px 0}
  .md-q{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:8px 0;color:var(--muted);font-family:var(--serif);font-style:italic}
  .md mark{background:#FAC775;padding:0 3px;border-radius:3px}
  .md code.md-code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:var(--font-mono,monospace);font-size:.9em}
  .md-hr{border:none;border-top:1px solid var(--line);margin:12px 0}
  .md a{color:var(--accent)}
  .md del{color:var(--faint)}
  .composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px 8px;margin-bottom:24px;transition:.2s}
  .composer:focus-within{border-color:var(--faint);box-shadow:0 6px 28px -18px rgba(0,0,0,.25)}
  .composer .titlein{width:100%;border:none;outline:none;font-family:var(--serif);font-size:18px;color:var(--ink);background:none;padding:12px 14px 2px}
  .composer .titlein::placeholder{color:var(--faint)}
  .composer textarea{width:100%;border:none;outline:none;resize:none;font-family:var(--sans);font-size:16px;color:var(--ink);background:none;padding:10px 14px 6px;line-height:1.5}
  .composer textarea::placeholder{color:var(--faint)}
  .composer .thumbs{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 4px}
  .composer .th{position:relative;width:62px;height:62px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .composer .th img{width:100%;height:100%;object-fit:cover}
  .composer .th button{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;font-size:11px;line-height:1}
  .composer .suggest{padding:2px 14px 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .composer .suggest .chip{background:var(--accent-soft);color:var(--accent);border:none;border-radius:100px;padding:3px 11px;cursor:pointer;font-size:12px}
  .composer .suggest .chip:hover{filter:brightness(.96)}
  .composer .row{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 14px;flex-wrap:wrap}
  .composer .meta{display:flex;gap:8px;flex:1;flex-wrap:wrap;align-items:center}
  .composer input[type=date]{font-family:var(--sans);font-size:13px;color:var(--muted);border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;cursor:pointer}
  .composer select,.composer .tagin{font-family:var(--sans);font-size:13px;color:var(--ink);border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;outline:none}
  .composer .tagin{width:130px}
  .composer .tagin::placeholder{color:var(--faint)}
  .iconbtn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;color:var(--muted);transition:.15s}
  .iconbtn:hover{border-color:var(--faint);color:var(--ink)}
  .iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none}
  .add{font-family:var(--sans);font-size:14px;font-weight:500;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 20px;cursor:pointer;transition:.15s}
  .add:hover{filter:brightness(1.08)}.add:active{transform:scale(.97)}
  .add:disabled{opacity:.5;cursor:default}

  .bar{display:flex;align-items:center;justify-content:space-between;margin:0 4px 14px;gap:10px;flex-wrap:wrap}
  .bar .count{font-size:13px;color:var(--muted)}
  .bar .filters{display:flex;gap:6px;flex-wrap:wrap}
  .bar .filters button{font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:100px;padding:4px 12px;cursor:pointer;transition:.15s}
  .bar .filters button:hover{border-color:var(--faint);color:var(--ink)}
  .bar .filters button.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}

  .list{display:flex;flex-direction:column;gap:12px}
  .entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;transition:.18s;position:relative}
  .entry:hover{border-color:var(--faint)}
  .entry .check{flex-shrink:0;width:20px;height:20px;border:1.5px solid var(--faint);border-radius:50%;cursor:pointer;margin-top:2px;transition:.15s;display:flex;align-items:center;justify-content:center}
  .entry .check.ro{pointer-events:none;cursor:default}
  .entry .check:hover{border-color:var(--accent)}
  .entry.done .check{background:var(--accent);border-color:var(--accent)}
  .entry .check svg{opacity:0;transition:.15s;width:11px;height:11px}
  .entry.done .check svg{opacity:1}
  .entry .arealine{flex-shrink:0;width:3px;align-self:stretch;border-radius:3px;margin:2px 0}
  .entry .body{flex:1;min-width:0}
  .entry .etitle{font-family:var(--serif);font-size:18px;margin-bottom:5px;line-height:1.3}
  .entry .text{font-size:15.5px;color:var(--ink);white-space:pre-wrap;word-wrap:break-word}
  .entry.reflection .text,.entry.memory .text{font-family:var(--serif);font-size:17px;line-height:1.6}
  .entry.knowledge .text{font-size:15px;line-height:1.62;color:#33312d}
  .entry.done .text{color:var(--done);text-decoration:line-through;text-decoration-color:var(--faint)}
  .entry .imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .entry .imgs img{width:140px;height:108px;object-fit:cover;border-radius:9px;border:1px solid var(--line);cursor:pointer;transition:.15s}
  .entry .imgs img:hover{filter:brightness(.95)}
  .entry .links{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px}
  .entry .links .lk{font-size:12px;color:var(--accent);background:var(--accent-soft);border:none;border-radius:8px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:5px}
  .entry .links .lk:hover{filter:brightness(.96)}
  .entry .links .lk::before{content:'↳';opacity:.6}
  .entry .foot{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .entry .tag{font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:2px 9px;border-radius:100px;cursor:pointer}
  .entry .tag:hover{border-color:var(--faint);color:var(--ink)}
  .entry .areapill{font-size:11px;padding:2px 9px;border-radius:100px}
  .entry .when{font-size:12px;color:var(--muted)}
  .entry .when.future{color:var(--accent)}
  .entry .acts{position:absolute;top:11px;right:11px;display:flex;gap:1px;opacity:0;transition:.15s}
  .entry:hover .acts{opacity:1}
  .entry .acts button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px;transition:.15s}
  .entry .acts button:hover{color:var(--ink);background:var(--bg)}
  .entry .acts .del:hover{color:#b04a3a}
  .menu{position:absolute;top:34px;right:11px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px;z-index:30;box-shadow:0 10px 30px -12px rgba(0,0,0,.3);display:none;min-width:170px;max-height:280px;overflow:auto}
  .menu.open{display:block}
  .menu .mhead{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:6px 12px 3px}
  .menu button{display:block;width:100%;text-align:left;font-size:13px;color:var(--ink);background:none;border:none;padding:7px 12px;border-radius:7px;cursor:pointer;opacity:1}
  .menu button:hover{background:var(--bg)}

  /* HOME blended */
  .home-greet{font-family:var(--serif);font-size:24px;line-height:1.4;margin:4px 4px 6px}
  .home-greet .gsub{display:block;font-style:italic;font-size:17px;color:var(--muted);margin-top:6px}
  .home-areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}
  .acard{background:var(--surface);border:0.5px solid var(--line);border-radius:var(--radius);padding:15px 16px;cursor:pointer;transition:.15s}
  .acard:hover{border-color:var(--faint)}
  .acard .ah{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .acard .ah .dot{width:9px;height:9px;border-radius:50%}
  .acard .ah .an{font-family:var(--serif);font-size:16px}
  .acard .astat{font-size:12.5px;color:var(--muted)}
  .acard .alast{font-size:12px;color:var(--faint);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .home-sec{margin:22px 0}
  .home-sec .sh{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 4px 10px}
  .home-row{display:flex;gap:11px;align-items:center;padding:8px 4px;border-top:0.5px solid var(--line)}
  .home-row:first-of-type{border-top:none}
  .home-row .rdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .home-row .rtext{font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .home-row.serif .rtext{font-family:var(--serif);font-size:15.5px}
  .home-row .rwhen{font-size:12px;color:var(--muted);flex-shrink:0}
  .home-row .rwhen.future{color:var(--accent)}
  .onthisday{background:var(--accent-soft);border-radius:var(--radius);padding:16px 18px;margin:22px 0}
  .onthisday .od{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .onthisday .oq{font-family:var(--serif);font-style:italic;font-size:16.5px;line-height:1.55;color:#2c3a2e}
  .daily-quote{text-align:center;margin:26px auto 28px;max-width:600px;padding:0 10px;position:relative}
  .daily-quote::before{content:'\201C';display:block;font-family:var(--serif);font-size:46px;line-height:.4;color:var(--faint);margin-bottom:8px}
  .daily-quote .dq-text{font-family:var(--serif);font-size:25px;line-height:1.5;color:var(--ink)}
  .daily-quote .dq-text p{margin:0}
  .home-status{text-align:center;font-size:13.5px;color:var(--muted);margin:0 0 26px}
  .entry .acts .feat{color:var(--faint)}
  .entry .acts .feat.on{color:#d9a400}
  .entry .acts .feat:hover{color:#d9a400}
  .feat-badge{font-size:11px;color:#b88600;background:#fbf0d0;border-radius:100px;padding:2px 10px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:3px}
  .entry.is-featured{box-shadow:inset 3px 0 0 #e8c14d}
  .none{font-size:13.5px;color:var(--faint);font-style:italic;font-family:var(--serif);padding:4px}

  /* calendar */
  .cal-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 12px}
  .cal-nav button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px}
  .cal-nav .cal-today{width:auto;padding:0 12px;font-size:13px}
  .cal-title{font-family:var(--serif);font-size:18px;color:var(--ink);min-width:160px;text-align:center}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0;font-weight:600}
  .cal-cell{min-height:78px;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--surface);overflow:hidden}
  .cal-cell.empty{border:none;background:none}
  .cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .cal-daynum{font-size:12px;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:4px}
  .cal-cell.today .cal-daynum{color:var(--accent);font-weight:700}
  .cal-dot{width:5px;height:5px;border-radius:50%;background:var(--muted);display:inline-block}
  .cal-chip{font-size:10px;line-height:1.3;padding:2px 4px;margin-bottom:2px;background:var(--bg);border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--ink)}
  .cal-chip.done{opacity:.5;text-decoration:line-through}
  .cal-more{font-size:10px;color:var(--muted);padding-left:4px}
  .cal-legend{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
  @media(max-width:600px){.cal-cell{min-height:58px;padding:3px}.cal-chip{font-size:9px;padding:1px 3px}.cal-title{font-size:16px;min-width:120px}}

  /* to-learn backlog */
  .learn-wrap{position:relative;padding:16px 20px 40px;max-width:760px}
  .learn-wrap .ws-sidebtn{left:auto;right:16px;top:16px}
  .learn-head{font-family:var(--serif);font-size:24px;color:var(--ink);margin:4px 0;padding-right:44px}
  .learn-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
  .learn-add{display:flex;gap:8px;margin-bottom:18px}
  .learn-add input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 13px;font-size:14px;font-family:var(--sans);color:var(--ink);outline:none}
  .learn-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:11px 2px}
  .learn-row.done .learn-text{color:var(--done);text-decoration:line-through;text-decoration-color:var(--faint)}
  .learn-check{flex:none;width:24px;height:24px;border:1.5px solid var(--faint);border-radius:50%;background:none;color:var(--accent);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
  .learn-text{flex:1;font-size:14.5px;color:var(--ink);line-height:1.4}
  .learn-acts{display:flex;gap:6px;flex:none}
  .learn-acts button{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
  .learn-acts button:hover{color:var(--ink);border-color:var(--faint)}
  .ws-empty-sm{font-size:14px;color:var(--muted);padding:24px 4px;font-style:italic;line-height:1.5}

  /* study focus timer */
  .ws-focusbtn{margin-top:8px;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:9px;padding:9px;font-size:13px;font-family:var(--sans);cursor:pointer;font-weight:600}
  .ws-focusbtn.running{background:var(--accent);color:#fff;border-color:var(--accent)}
  .study-time{font-size:12.5px;color:var(--muted);margin-top:4px}
  .study-time b{color:var(--ink)}
  #focusBar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:7000;display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;padding:8px 14px;border-radius:999px;box-shadow:0 6px 22px rgba(0,0,0,.25);font-family:var(--sans);font-size:14px}
  #focusBar .fb-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:fbpulse 1.6s infinite}
  @keyframes fbpulse{0%,100%{opacity:1}50%{opacity:.3}}
  #focusBar .fb-label{font-size:13px;opacity:.9}
  #focusBar .fb-time{font-variant-numeric:tabular-nums;font-weight:700;min-width:56px;text-align:center}
  #focusBar .fb-stop{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600}
  #focusBar .fb-stop:hover{background:rgba(255,255,255,.34)}
  body.focusing nav,body.focusing #acctBar,body.focusing #micBtn{opacity:.25;transition:opacity .3s}
  body.focusing nav:hover,body.focusing #acctBar:hover{opacity:1}

  /* timeline */
  .tl-month{font-family:var(--serif);font-size:15px;color:var(--muted);margin:22px 4px 10px}
  .tl-month:first-child{margin-top:0}
  .tl-item{display:flex;gap:14px;padding-left:4px}
  .tl-item .rail{position:relative;width:14px;flex-shrink:0;display:flex;justify-content:center}
  .tl-item .rail::before{content:'';position:absolute;top:0;bottom:-12px;width:1px;background:var(--line)}
  .tl-item .rail .node{width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--faint);margin-top:17px;z-index:1}
  .tl-item.future .rail .node{border-color:var(--accent)}
  .tl-item .ti-card{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:12px}
  .tl-item .ti-when{font-size:11.5px;color:var(--muted);margin-bottom:3px}
  .tl-item.future .ti-when{color:var(--accent)}
  .tl-item .ti-text{font-size:14.5px}
  .tl-item .ti-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-left:7px}

  .empty{text-align:center;padding:64px 20px;color:var(--faint)}
  .empty .mark{font-family:var(--serif);font-size:32px;font-style:italic;margin-bottom:8px}
  .empty p{font-size:14px}
  .loading{text-align:center;padding:56px;color:var(--faint);font-size:14px}

  /* modal (manage areas / link picker) */
  .overlay{position:fixed;inset:0;background:rgba(20,18,15,.4);display:none;align-items:center;justify-content:center;z-index:90;padding:24px}
  .overlay.open{display:flex}
  .modal{background:var(--surface);border-radius:16px;padding:24px;max-width:440px;width:100%;max-height:80vh;overflow:auto}
  .modal h3{font-family:var(--serif);font-weight:500;font-size:21px;margin-bottom:4px}
  .modal .msub{font-size:13px;color:var(--muted);margin-bottom:18px}
  .arearow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:0.5px solid var(--line)}
  .arearow input[type=text]{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:var(--sans);font-size:14px;outline:none}
  .arearow input[type=color]{width:30px;height:30px;border:none;border-radius:8px;background:none;cursor:pointer;padding:0}
  .arearow button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;padding:4px}
  .arearow button:hover{color:#b04a3a}
  .modal .addarea{display:flex;gap:8px;margin-top:14px}
  .modal .addarea input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:14px;outline:none}
  .modal .mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
  .modal .mfoot button{font-size:14px;border-radius:9px;padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:var(--bg)}
  .modal .mfoot .prim{background:var(--accent);color:#fff;border:none}
  .linkopt{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer}
  .linkopt:hover{background:var(--bg)}
  .linkopt.sel{background:var(--accent-soft)}
  .linkopt .lk-t{font-size:14px;flex:1}
  .linkopt .lk-s{font-size:11px;color:var(--faint)}

  .srcseg{display:flex;gap:4px;padding:8px 10px 2px}
  .srcseg .seg,.graph-ctrl .seg{font-size:12.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:100px;padding:5px 13px;cursor:pointer;transition:.15s}
  .srcseg .seg:hover,.graph-ctrl .seg:hover{border-color:var(--faint);color:var(--ink)}
  .srcseg .seg.on,.graph-ctrl .seg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .srcfields{display:flex;gap:8px;flex-wrap:wrap;padding:6px 12px 2px}
  .srcfields .srcfield{flex:1;min-width:120px;font-size:13px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;outline:none;font-family:var(--sans)}
  .srcfields .srcfield:focus{border-color:var(--faint)}
  .srcmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
  .srcbadge{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px}
  .srcmeta .cite{font-size:12.5px;color:var(--muted);font-style:italic}
  .srcmeta .cite-link{font-size:12px;color:var(--accent);text-decoration:none}
  .chapter{margin-bottom:6px}
  .chaptoggle{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;font-family:var(--serif);font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px;transition:.15s}
  .chaptoggle:hover{border-color:var(--faint)}
  .chaptoggle .chev{font-size:11px;color:var(--muted)}
  .chaptoggle .chcount{margin-left:auto;font-family:var(--sans);font-size:12px;color:var(--faint);background:var(--surface);border-radius:100px;padding:1px 9px}
  .chapter-body{display:flex;flex-direction:column;gap:10px;padding:10px 0 4px 14px;border-left:1px solid var(--line);margin-left:8px}
  .graph-ctrl{display:flex;align-items:center;gap:7px;justify-content:center;margin-bottom:12px}
  .graph-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  .graph-legend .lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .graph-legend .lgd{width:9px;height:9px;border-radius:50%}
  .modal select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-family:var(--sans);outline:none}

  /* ====== KNOWLEDGE WORKSPACE ====== */
  body.ws-mode{background:var(--bg)}
  #workspace{max-width:1200px;margin:0 auto}
  .ws-shell{display:grid;grid-template-columns:280px 1fr;gap:0;height:100vh}
  .ws-shell.collapsed{grid-template-columns:1fr}
  .ws-side{border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;background:var(--surface)}
  .ws-side.hidden{display:none}
  .ws-side-top{padding:16px 16px 8px}
  .ws-back{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:6px 8px;border-radius:8px;font-family:var(--sans)}
  .ws-back:hover{background:var(--bg);color:var(--ink)}
  .ws-search{padding:4px 14px 8px}
  .ws-search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 12px;font-size:13.5px;outline:none;font-family:var(--sans)}
  .ws-search input:focus{border-color:var(--faint)}
  .ws-srctabs{display:flex;gap:4px;padding:0 12px 8px;flex-wrap:wrap}
  .ws-srctab{font-size:11.5px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:100px;padding:3px 10px;cursor:pointer}
  .ws-srctab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .ws-newnote{margin:4px 14px 8px;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px;font-size:13.5px;cursor:pointer;font-family:var(--sans);font-weight:500}
  .ws-newnote:hover{filter:brightness(1.08)}
  .ws-list{flex:1;overflow-y:auto;padding:4px 8px 20px}
  .ws-item{width:100%;text-align:left;background:none;border:none;border-radius:9px;padding:9px 10px;cursor:pointer;display:flex;gap:9px;align-items:flex-start;margin-bottom:1px}
  .ws-item:hover{background:var(--bg)}
  .ws-item.on{background:var(--accent-soft)}
  .ws-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:6px}
  .ws-item-body{min-width:0;flex:1}
  .ws-item-t{display:block;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ws-item-s{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .ws-book{margin:6px 0}
  .ws-bookname{font-family:var(--serif);font-size:13px;color:var(--muted);padding:6px 10px 2px;letter-spacing:.02em}
  .ws-chap{margin-left:4px}
  .ws-chaptoggle{width:100%;text-align:left;background:none;border:none;font-size:12.5px;color:var(--ink);padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:5px}
  .ws-chaptoggle:hover{color:var(--accent)}
  .ws-cc{margin-left:auto;font-size:11px;color:var(--faint)}
  .ws-none{font-size:13px;color:var(--faint);font-style:italic;font-family:var(--serif);padding:14px}
  .ws-groupby{display:flex;align-items:center;gap:5px;padding:2px 14px 10px}
  .ws-gb-lbl{font-size:11px;color:var(--faint);margin-right:2px}
  .ws-gb{font-size:11.5px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:100px;padding:3px 11px;cursor:pointer}
  .ws-gb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .ws-subjgroup{margin:2px 0}
  .ws-subjhead{width:100%;text-align:left;background:none;border:none;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .ws-subjhead:hover .ws-subjname{color:var(--accent)}
  .ws-chev{font-size:10px;color:var(--faint)}
  .ws-subjname{font-family:var(--serif);font-size:13.5px;color:var(--ink);font-weight:500}
  .ws-subjbody{padding-left:6px}
  .ws-subcatgroup{margin:1px 0 1px 8px}
  .ws-subcathead{width:100%;text-align:left;background:none;border:none;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .ws-subcathead:hover .ws-subcatname{color:var(--accent)}
  .ws-subcatname{font-size:12.5px;color:var(--muted)}
  .ws-subcatbody{padding-left:8px;border-left:1px dashed var(--line);margin-left:9px}
  .ws-studyfilter{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--accent-soft);margin:0 12px 8px;padding:7px 11px;border-radius:9px}
  .ws-studyfilter b{color:var(--accent)}
  .ws-studyfilter button{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px}
  .ws-subjrow{display:flex;align-items:center;gap:8px;padding:10px 0 4px;flex-wrap:wrap}
  .ws-subjlabel{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
  .ws-subjinput{border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:14px;font-family:var(--sans);outline:none;color:var(--ink);background:var(--surface);min-width:140px}
  .ws-subjinput:focus{border-color:var(--accent)}
  .ws-studylink{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;font-family:var(--sans);outline:none;background:var(--surface);color:var(--ink)}
  .ws-subjai{font-size:12px;color:var(--accent);background:var(--accent-soft);border:none;border-radius:8px;padding:6px 12px;cursor:pointer}
  .ws-subjai:hover{filter:brightness(.97)}
  .sc-notes{margin-top:10px;width:100%;background:none;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:12.5px;color:var(--accent);cursor:pointer;font-family:var(--sans)}
  .sc-notes:hover{border-color:var(--accent);background:var(--accent-soft)}
  .ws-main{height:100vh;overflow-y:auto}
  .ws-empty{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
  .ws-empty-in{text-align:center;color:var(--faint)}
  .ws-empty-mark{font-family:var(--serif);font-size:34px;font-style:italic;margin-bottom:10px}
  .ws-empty-in p{font-size:14px;margin-bottom:16px}
  .ws-empty-in .add{padding:9px 20px}
  .ws-sidebtn{position:absolute;top:16px;left:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:14px}
  .ws-sidebtn:hover{border-color:var(--faint);color:var(--ink)}
  .ws-editor{max-width:1000px;margin:0 auto;padding:16px 28px 80px}
  .ws-toolbar{display:flex;align-items:center;gap:8px;padding:6px 0 14px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
  .ws-toolbar .ws-sidebtn{position:static}
  .ws-src,.ws-area{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12.5px;font-family:var(--sans);outline:none;cursor:pointer}
  .ws-save{font-size:12px;color:var(--muted);min-width:64px}
  .ws-tspace{flex:1}
  .ws-tbtn{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
  .ws-tbtn svg{width:16px;height:16px}
  .ws-tbtn:hover{border-color:var(--faint);color:var(--ink)}
  .ws-tbtn.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
  .ws-tbtn.ws-del:hover{color:#b04a3a;border-color:#e0b0a8}
  .ws-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .ws-meta-f{flex:1;min-width:130px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:13px;outline:none;font-family:var(--sans)}
  .ws-meta-f:focus{border-color:var(--faint)}
  .ws-title{width:100%;border:none;outline:none;background:none;font-family:var(--serif);font-size:30px;font-weight:500;color:var(--ink);padding:6px 0 8px;line-height:1.2}
  .ws-title::placeholder{color:var(--faint)}
  .ws-mdbar{display:flex;gap:2px;padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
  .ws-mdbar button{min-width:32px;height:30px;border:none;background:none;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted);font-family:var(--serif)}
  .ws-mdbar button:hover{background:var(--surface);color:var(--ink)}
  .ws-panes{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:340px}
  .ws-text{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:18px 20px;font-family:var(--font-mono,'SF Mono',Menlo,monospace);font-size:14px;line-height:1.7;color:var(--ink);outline:none;resize:none;min-height:340px}
  .ws-text:focus{border-color:var(--faint)}
  .ws-preview{border:1px solid transparent;border-radius:12px;padding:18px 4px;overflow-y:auto;max-height:70vh}
  .ws-imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .ws-img{position:relative;width:160px;height:120px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .ws-img img{width:100%;height:100%;object-fit:cover;cursor:pointer}
  .ws-img button{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;font-size:11px}
  .ws-links{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
  .ws-links-h,.ws-history-h{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .ws-link{display:inline-flex;align-items:center;font-size:13px;color:var(--accent);background:var(--accent-soft);border:none;border-radius:8px;padding:5px 12px;margin:0 6px 6px 0;cursor:pointer}
  .ws-link:hover{filter:brightness(.96)}
  .ws-tagrow{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
  .ws-tag{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:2px 10px;border-radius:100px}
  .ws-history{margin-top:22px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .ws-cards{margin-top:22px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .ws-cards-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-bottom:12px}
  .ws-cards-n{font-size:11px;color:var(--faint);background:var(--bg);border-radius:100px;padding:1px 9px}
  .ws-cards-h .ws-hx{margin-left:auto;background:none;border:none;color:var(--faint);cursor:pointer;font-size:14px}
  .ws-cards-actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .ws-cardgen{font-size:12.5px;color:#fff;background:var(--accent);border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-family:var(--sans)}
  .ws-cardgen:disabled{opacity:.6;cursor:default}
  .ws-cardadd,.ws-cardexp{font-size:12.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-family:var(--sans)}
  .ws-cardadd:hover,.ws-cardexp:hover{border-color:var(--faint);color:var(--ink)}
  .ws-cardexp{color:var(--accent)}
  .ws-cardlist{display:flex;flex-direction:column;gap:8px}
  .ws-card{display:flex;gap:8px;align-items:flex-start}
  .ws-card-t{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:var(--sans);outline:none;resize:vertical;background:var(--bg);color:var(--ink);line-height:1.5}
  .ws-card-t:focus{border-color:var(--accent);background:var(--surface)}
  .ws-card-rm{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;padding:6px 4px}
  .ws-card-rm:hover{color:#b04a3a}
  .ws-cards-hint{font-size:11.5px;color:var(--faint);margin-top:12px;line-height:1.5}
  .ws-cards-hint code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:11px}
  .ws-history-h{display:flex;justify-content:space-between;align-items:center}
  .ws-hx{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px}
  .ws-rev{padding:11px 0;border-top:1px solid var(--line)}
  .ws-rev-meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:5px}
  .ws-pin{color:var(--accent)}
  .ws-rev-prev{font-size:13px;color:var(--ink);margin-bottom:7px;line-height:1.5}
  .ws-restore{font-size:12px;background:none;border:1px solid var(--line);border-radius:7px;padding:4px 12px;cursor:pointer;color:var(--muted)}
  .ws-restore:hover{border-color:var(--accent);color:var(--accent)}
  @media(max-width:760px){
    .ws-shell{grid-template-columns:1fr}
    .ws-side{position:fixed;top:0;left:0;width:280px;z-index:40;box-shadow:0 0 40px rgba(0,0,0,.2)}
    .ws-panes{grid-template-columns:1fr}
    .ws-preview{max-height:none}
    .ws-editor{padding:16px 18px 60px}
    nav{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;width:100%;max-width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    nav::-webkit-scrollbar{display:none}
    nav>button{flex:0 0 auto;white-space:nowrap}
  }

  /* background layer */
  #bgLayer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s;
    filter:saturate(.9)}
  #bgLayer::after{content:'';position:absolute;inset:0;background:var(--bg);opacity:.86}
  body.ws-mode #bgLayer{opacity:0!important}

  /* nav: knowledge rightmost, distinct */
  .nav-sep{flex:1;min-width:8px}
  .nav-knowledge{color:#7F77DD!important;border:1px solid #d8d4f4!important;background:#f4f2fd!important;font-weight:500;width:30px;padding:7px 0!important;text-align:center;margin-left:6px}
  .nav-knowledge:hover{background:#ece9fb!important}
  .nav-knowledge.on{background:#7F77DD!important;color:#fff!important;border-color:#7F77DD!important}

  /* home toggle */
  .home-toggle{display:flex;gap:2px;justify-content:center;margin:40px auto 0;background:none;border:none;padding:0;width:fit-content}
  .home-toggle button{font-size:12px;color:var(--faint);background:none;border:none;border-radius:100px;padding:5px 14px;cursor:pointer;transition:.15s}
  .home-toggle button:hover{color:var(--muted)}
  .home-toggle button.on{background:var(--bg);color:var(--muted)}

  /* journal home */
  .jr-greet{font-family:var(--serif);font-size:30px;line-height:1.3;margin:6px 4px 20px;text-align:center}
  .jr-greet .jr-sub{display:block;font-style:italic;font-size:17px;color:var(--muted);margin-top:8px}
  .jr-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
  .jr-photo{position:relative;height:130px;border-radius:14px;background-size:cover;background-position:center;border:none;cursor:pointer;overflow:hidden;display:flex;align-items:flex-end}
  .jr-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.55))}
  .jr-photo-cap{position:relative;z-index:1;color:#fff;font-size:12px;padding:10px;text-align:left;line-height:1.3}
  .jr-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;margin-top:6px}
  @media(max-width:680px){.jr-cols{grid-template-columns:1fr}}
  .jr-reflection{font-family:var(--serif);font-size:16.5px;line-height:1.65;padding:14px 0;border-top:1px solid var(--line);color:var(--ink)}
  .jr-reflection:first-of-type{border-top:none}
  .jr-rdate{font-family:var(--sans);font-size:12px;color:var(--faint);margin-top:8px}

  /* photo memory cards (image-forward) */
  .entry.photomem{display:block;padding:0;overflow:hidden;background:var(--mtint2,var(--surface))}
  .entry.photomem.is-bg{box-shadow:0 0 0 2px var(--mtint,var(--accent-soft))}
  .pm-hero{position:relative;width:100%;max-height:340px;overflow:hidden;background:var(--mtint)}
  .pm-hero img{width:100%;max-height:340px;object-fit:cover;display:block;cursor:pointer}
  .pm-bg{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.45);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .pm-bg.on{background:rgba(255,255,255,.92);color:#d9a400}
  .pm-body{padding:16px 18px;background:var(--mtint2,var(--surface))}
  .pm-extra{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .pm-extra .pm-shot{position:relative;display:inline-flex}
  .pm-extra img{width:80px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--line)}
  .pm-bg.sm{width:22px;height:22px;top:5px;right:5px;font-size:12px}
  .entry.photomem .acts{top:12px;left:12px;right:auto}
  .entry.photomem .acts button{background:rgba(0,0,0,.4);color:#fff;backdrop-filter:blur(4px)}
  .entry.photomem .acts button:hover{background:rgba(0,0,0,.6)}

  /* workspace view toggle + graph */
  .ws-viewtog{display:flex;gap:3px;padding:6px 14px 4px}
  .ws-vt{font-size:12.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:100px;padding:5px 14px;cursor:pointer}
  .ws-vt.on{background:#7F77DD;color:#fff;border-color:#7F77DD}
  .ws-graphwrap{padding:18px 24px;position:relative}
  .ws-graph-head{font-family:var(--serif);font-size:20px;margin-bottom:10px}
  .ws-graph-ctrl{display:flex;align-items:center;gap:7px;margin-bottom:12px}
  .ws-graphwrap .ws-sidebtn{position:absolute;top:18px;right:24px}

  /* workspace editor extras */
  .ws-fontctrl{display:flex;gap:2px;margin-right:4px}
  .ws-fontctrl button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
  .ws-fontctrl button:hover{border-color:var(--faint);color:var(--ink)}
  .ws-md-h,.ws-md-h2{font-family:var(--serif)!important;padding:0 10px!important;min-width:auto!important}
  .ws-md-h{font-size:15px!important;font-weight:500}
  .ws-md-h2{font-size:13px!important;color:var(--muted)!important}
  .ws-mdsep{width:1px;height:18px;background:var(--line);margin:0 4px}
  .ws-prevbtn{font-family:var(--sans);font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 14px;cursor:pointer;color:var(--accent)}
  .ws-prevbtn.on{background:var(--accent-soft);border-color:var(--accent-soft)}
  .ws-text.hide,.ws-preview.hide{display:none}
  .ws-editor .ws-text{width:100%;font-size:calc(14px * var(--ws-fs,1));min-height:50vh}
  .ws-editor .ws-preview{font-size:calc(16px * var(--ws-fs,1));max-width:none;padding:8px 2px 40px}
  .ws-editor .ws-title{font-size:calc(30px * var(--ws-fs,1))}

  /* ===== LOG ===== */
  .log-composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px;margin-bottom:18px}
  .log-composer textarea{width:100%;border:none;outline:none;resize:none;font-family:var(--sans);font-size:16px;color:var(--ink);background:none;padding:12px 12px 4px;line-height:1.55}
  .log-composer textarea::placeholder{color:var(--faint)}
  .log-comp-foot{display:flex;align-items:center;gap:8px;padding:4px 8px}
  .log-hint{font-size:12px;color:var(--faint)}
  .log-review{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
  .log-review-h{font-size:13px;font-weight:500;margin-bottom:12px}
  .log-item{border-top:1px solid var(--line);padding:11px 0}
  .log-item:first-child{border-top:none}
  .log-it-text{width:100%;border:none;outline:none;resize:none;font-family:var(--sans);font-size:14.5px;background:none;color:var(--ink);line-height:1.5;padding:0 0 6px}
  .log-it-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .log-it-controls select{font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:4px 8px;outline:none;font-family:var(--sans)}
  .log-it-tags{font-size:11.5px;color:var(--accent)}
  .log-it-rm{margin-left:auto;background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px}
  .log-it-rm:hover{color:#b04a3a}
  .log-review-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .log-daynav{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 16px}
  .log-daynav button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:16px;color:var(--muted)}
  .log-daynav button:hover:not(:disabled){border-color:var(--faint);color:var(--ink)}
  .log-daynav button:disabled{opacity:.35;cursor:default}
  .log-daylabel{font-family:var(--serif);font-size:18px;text-align:center}
  .log-daydate{display:block;font-family:var(--sans);font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
  .entry.log .text{font-size:15px}

  /* ===== GOAL HIERARCHY ===== */
  .goals-tree{display:flex;flex-direction:column;gap:8px}
  .goal-node{border-radius:var(--radius)}
  .goal-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gc,var(--line));border-radius:var(--radius);padding:12px 14px;transition:.15s}
  .goal-row:hover{border-color:var(--faint)}
  .goal-row.done .goal-text{color:var(--done);text-decoration:line-through}
  .goal-check{width:20px;height:20px;border:1.5px solid var(--faint);border-radius:50%;background:none;cursor:pointer;color:var(--accent);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .goal-check.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .habit-check{width:24px;height:24px;border:1.5px solid var(--gc,var(--faint));border-radius:8px;background:none;cursor:pointer;font-size:13px;color:var(--gc,var(--muted));display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .habit-check.on{background:var(--gc,var(--accent));border-color:var(--gc,var(--accent));color:#fff}
  .goal-text{flex:1;font-size:15px;min-width:0}
  .goal-streak{font-size:12.5px;color:#c0691f;font-weight:500;flex-shrink:0}
  .goal-prog{font-size:12px;color:var(--muted);background:var(--bg);border-radius:100px;padding:1px 9px;flex-shrink:0}
  .goal-area{font-size:11.5px;flex-shrink:0}
  .goal-acts{display:flex;gap:1px;opacity:0;transition:.15s;flex-shrink:0}
  .goal-row:hover .goal-acts{opacity:1}
  .goal-acts button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;padding:3px 5px;border-radius:6px}
  .goal-acts button:hover{color:var(--ink);background:var(--bg)}
  .goal-children{margin-left:22px;margin-top:8px;padding-left:14px;border-left:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
  .opt-check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);cursor:pointer;padding:2px 0}
  .opt-parent{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:6px 10px;margin-top:8px}

  /* ===== STUDY TRACKER ===== */
  .study-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .study-streak{display:flex;align-items:baseline;gap:8px}
  .study-streak .ss-num{font-family:var(--serif);font-size:34px;color:var(--ink)}
  .study-streak .ss-lbl{font-size:13.5px;color:var(--muted)}
  .study-propose{background:var(--accent-soft);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
  .study-propose .sp-h{font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .sp-row{display:flex;align-items:center;gap:10px;padding:6px 0}
  .sp-name{font-size:14px;font-weight:500}
  .sp-change{font-size:13px;color:var(--muted);flex:1}
  .sp-yes,.sp-no{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 11px;cursor:pointer}
  .sp-yes{color:var(--accent);border-color:var(--accent)}
  .sp-no{color:var(--muted)}
  .study-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .study-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sc,var(--line));border-radius:var(--radius);padding:15px 16px}
  .sc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .sc-name{font-size:15.5px;font-weight:500;line-height:1.3}
  .sc-acts{display:flex;gap:1px;flex-shrink:0}
  .sc-acts button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:12px;padding:3px 5px;border-radius:6px}
  .sc-acts button:hover{color:var(--ink);background:var(--bg)}
  .sc-area{font-size:11.5px;margin:2px 0 12px}
  .sc-bar{height:8px;background:var(--bg);border-radius:100px;overflow:hidden;margin-bottom:8px}
  .sc-fill{height:100%;border-radius:100px;transition:width .3s}
  .sc-foot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .sc-pct{font-weight:500}
  .sc-update{display:flex;align-items:center;gap:6px}
  .sc-update button{width:30px;height:30px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;font-size:16px;color:var(--muted)}
  .sc-update button:hover{border-color:var(--faint);color:var(--ink)}
  .sc-set{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;outline:none;text-align:center;font-family:var(--sans)}
  nav button.has-badge::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}
  .anki-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
  .anki-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .anki-h{font-size:13px;font-weight:500}
  .anki-sync{font-size:12.5px;color:var(--accent);background:var(--accent-soft);border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-family:var(--sans)}
  .anki-sync.unreachable{color:var(--muted);background:var(--bg)}
  .anki-sync.syncing{opacity:.6}
  .anki-stats{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
  .ak{font-size:12.5px;color:var(--muted)}
  .ak b{font-size:16px;color:var(--ink);font-weight:500;margin-right:2px}
  .ak-due b{color:#c0451f}
  .ak-mature b{color:#1D9E75}
  .ak-total{font-size:11.5px;color:var(--faint);margin-left:auto}
  .anki-empty{font-size:12.5px;color:var(--faint);line-height:1.5}
  .ws-card-anki{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;padding:8px 0 12px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .ws-card-anki-t{font-size:11px;color:var(--faint);margin-left:auto}
  .ws-card-exp-badge{font-size:10.5px;color:var(--accent);background:var(--accent-soft);border-radius:100px;padding:1px 8px}

  /* ===== WELLNESS ===== */
  .wel-intro{font-size:13.5px;color:var(--muted);text-align:center;margin-bottom:14px}
  .wel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:22px}
  .wel-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .wel-top{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .wel-name{font-size:15.5px;font-weight:500;flex:1}
  .wel-streak{font-size:12.5px;color:#c0691f;font-weight:500}
  .wel-checkbox{width:24px;height:24px;border:1.5px solid var(--faint);border-radius:7px;background:none;cursor:pointer;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;padding:0}
  .wel-checkbox:hover{border-color:var(--muted)}
  .wel-hours{display:flex;align-items:center;gap:7px}
  .wel-hours button{width:34px;height:34px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;font-size:17px;color:var(--muted)}
  .wel-hours button:hover{border-color:var(--faint);color:var(--ink)}
  .wel-hin{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;outline:none;text-align:center;font-family:var(--sans)}
  .wel-unit{font-size:12.5px;color:var(--muted)}
  .wel-dot-icon{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .diet-stats{display:flex;gap:14px;margin:11px 0 9px;padding:9px 12px;background:var(--bg);border-radius:9px}
  .diet-stats .ds{font-size:13px;color:var(--muted)}
  .diet-stats .ds b{font-size:16px;color:var(--ink);font-weight:500}
  .diet-scan{width:100%;border:1px dashed var(--line);background:none;border-radius:9px;padding:9px;cursor:pointer;font-size:13px;color:var(--muted);font-family:var(--sans);transition:.15s}
  .diet-scan:hover{border-color:var(--faint);color:var(--ink)}
  .wel-week{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .wel-week-h{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
  .wel-week-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
  .wel-week-lbl{font-size:13.5px;color:var(--ink)}
  .wel-week-dots{display:flex;gap:6px}
  .wel-dot{width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
  .wel-dot.on{background:#1D9E75;border-color:#1D9E75}
  .wel-hist-btn{background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px;padding:0 4px;line-height:1}
  .wel-hist-btn:hover{color:var(--ink)}
  .wel-note{width:100%;margin-top:11px;border:none;border-top:1px solid var(--line);background:none;padding:9px 2px 2px;font-size:13px;color:var(--ink);outline:none;font-family:var(--sans)}
  .wel-note::placeholder{color:var(--faint)}
  .wel-hist-list{max-height:50vh;overflow-y:auto;margin:4px 0}
  .wel-hist-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:0.5px solid var(--line)}
  .wel-hist-row:first-child{border-top:none}
  .wh-date{font-size:12.5px;color:var(--muted);min-width:96px;display:flex;align-items:center;gap:7px}
  .wh-val{font-size:13px}
  .wh-note{flex:1;border:1px solid transparent;border-radius:7px;padding:6px 9px;font-size:13.5px;outline:none;background:var(--bg);font-family:var(--sans);color:var(--ink)}
  .wh-note:focus{border-color:var(--faint);background:var(--surface)}

  .pursuit-sub{display:flex;gap:3px;justify-content:center;margin:0 auto 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;width:fit-content}
  .pursuit-sub button{font-size:13px;color:var(--muted);background:none;border:none;border-radius:9px;padding:6px 20px;cursor:pointer}
  .pursuit-sub button.on{background:var(--ink);color:var(--bg)}

  .log-viewtog{display:flex;gap:2px;justify-content:center;margin:0 auto 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;width:fit-content}
  .log-viewtog button{font-size:13px;color:var(--muted);background:none;border:none;border-radius:9px;padding:6px 20px;cursor:pointer}
  .log-viewtog button.on{background:var(--ink);color:var(--bg)}
  .tl-item{cursor:pointer}

  .lightbox{position:fixed;inset:0;background:rgba(20,18,15,.88);display:none;align-items:center;justify-content:center;z-index:100;padding:30px}
  .lightbox.open{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px}
  .lightbox .x{position:absolute;top:20px;right:24px;color:#fff;font-size:26px;cursor:pointer;background:none;border:none}
  @media(max-width:560px){header h1{font-size:34px}.app{padding:0 16px 100px}}
  #toast{display:none}
  .trashrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .trashtxt{flex:1;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trashacts{display:flex;gap:6px;flex-shrink:0}
  .trashacts button{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;color:var(--ink)}
  button.danger{color:#b04a3a;border-color:#e3c4bd}
  #trashlist{max-height:50vh;overflow:auto;margin:10px 0}
  #micBtn.rec{background:#c0392b;animation:micpulse 1.2s infinite}
  @keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(192,57,58,.5)}70%{box-shadow:0 0 0 12px rgba(192,57,58,0)}100%{box-shadow:0 0 0 0 rgba(192,57,58,0)}}
  .ws-review{padding:36px 28px;max-width:680px;margin:0 auto;position:relative}
  .ws-review-head{font-size:13px;color:var(--muted);margin-bottom:18px;text-align:center}
  .ws-review-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px}
  .ws-review-title{font-family:var(--serif);font-size:22px;color:var(--ink);margin-bottom:4px}
  .ws-review-subj{font-size:12px;color:var(--muted);margin-bottom:14px}

let current='home', areaFilter=null, activeTag=null, search='', pendingImgs=[], pendingLinks=[], menuOpen=null, suggestedTags=[], tagBusy=false, trash=[], theme='light', dietGoal='';
let curSource='field', graphColorBy='area', collapsedChapters={};

// Storage fallback: in the Claude chat sandbox, window.storage is provided.

// (same get/set shape: get returns {value} or null, set stores a string).
if(!window.storage){
  window.storage={
    get:async k=>{const value=localStorage.getItem(k);return value==null?null:{value};},
    set:async (k,v)=>{localStorage.setItem(k,v);}

}

async function load(){
  try{const r=await window.storage.get('repo:entries');entries=r&&r.value?JSON.parse(r.value):[];}catch(e){entries=[];}

  try{const p=await window.storage.get('repo:prefs');if(p&&p.value){const pr=JSON.parse(p.value);homeMode=pr.homeMode||'dashboard';wsFontScale=pr.wsFontScale||1;theme=pr.theme||'light';dietGoal=pr.dietGoal||'';}}catch(e){}

// ---- Voice capture (browser speech-to-text, free) ----
const _SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let _recog=null,_micTarget=null,_micOn=false;
function setupMic(){
  const btn=$('micBtn');if(!btn)return;
  if(!_SR){btn.style.display='none';return;}
  btn.style.display='flex';
  btn.onclick=()=>{
    if(_micOn){try{_recog&&_recog.stop();}catch(e){}return;}
    if(!_micTarget){showToast('Tap a text box first, then the mic.');return;}
    try{_recog=new _SR();}catch(e){showToast('Voice input not available here.');return;}
    _recog.lang='en-US';_recog.interimResults=false;_recog.continuous=true;
    _recog.onresult=ev=>{let txt='';for(let i=ev.resultIndex;i<ev.results.length;i++){if(ev.results[i].isFinal)txt+=ev.results[i][0].transcript;}txt=txt.trim();if(txt&&_micTarget){const v=_micTarget.value||'';_micTarget.value=v+((v&&!/\s$/.test(v))?' ':'')+txt;_micTarget.dispatchEvent(new Event('input',{bubbles:true}));}};
    _recog.onend=()=>{_micOn=false;btn.classList.remove('rec');btn.textContent='🎤';};
    _recog.onerror=()=>{_micOn=false;btn.classList.remove('rec');btn.textContent='🎤';};
    try{_recog.start();_micOn=true;btn.classList.add('rec');btn.textContent='⏹';}catch(e){}
  };
}
async function saveStudy(){try{await window.storage.set('repo:study',JSON.stringify(studySources));}catch(e){console.error(e);}}
async function saveWellness(){try{await window.storage.set('repo:wellness',JSON.stringify(wellnessLog));}catch(e){console.error(e);}}
async function saveEntries(){try{await window.storage.set('repo:entries',JSON.stringify(entries));}catch(e){console.error(e);alert('Save failed — storage may be full (images are large). Try fewer/smaller images.');}}
async function saveAreas(){try{await window.storage.set('repo:areas',JSON.stringify(areas));}catch(e){console.error(e);}}
// ---- Trash: soft delete + undo + restore ----
async function saveTrash(){try{await window.storage.set('repo:trash',JSON.stringify(trash));}catch(e){console.error(e);}}
async function softDelete(ids){
  const set=new Set(ids);
  const moved=entries.filter(e=>set.has(e.id));
  if(!moved.length)return;
  const now=new Date().toISOString();
  moved.forEach(e=>{e._deletedAt=now;trash.unshift(e);});
  entries=entries.filter(e=>!set.has(e.id));
  await saveEntries();await saveTrash();
}
async function restoreFromTrash(ids){
  const set=new Set(ids);
  trash.filter(e=>set.has(e.id)).forEach(e=>{delete e._deletedAt;entries.push(e);});
  trash=trash.filter(e=>!set.has(e.id));
  await saveEntries();await saveTrash();
}
async function purgeFromTrash(ids){
  const set=new Set(ids);
  trash=trash.filter(e=>!set.has(e.id));
  entries.forEach(e=>{if(e.links)e.links=e.links.filter(l=>!set.has(l));});
  await saveEntries();await saveTrash();
}
let _toastTimer=null;
function showToast(msg,actionLabel,actionFn){
  const t=$('toast');if(!t)return;
  $('toastMsg').textContent=msg;
  const a=$('toastAction');
  if(actionFn){a.style.display='inline';a.textContent=actionLabel||'Undo';a.onclick=()=>{hideToast();actionFn();};}
  else a.style.display='none';
  t.style.display='flex';
  clearTimeout(_toastTimer);_toastTimer=setTimeout(hideToast,6000);
}
function hideToast(){const t=$('toast');if(t)t.style.display='none';clearTimeout(_toastTimer);}
function openTrash(){
  const m=$('modal');
  const items=trash.slice().sort((a,b)=>(b._deletedAt||'').localeCompare(a._deletedAt||''));
  const labelOf=e=>{const ty=(TYPES[e.type]&&TYPES[e.type].label)||e.type||'Item';const txt=((e.title||e.text||'')+'').trim().replace(/\s+/g,' ').slice(0,60)||'(empty)';return esc(ty+' · '+txt);};
  const list=items.length?items.map(e=>`<div class="trashrow"><span class="trashtxt">${labelOf(e)}</span><span class="trashacts"><button data-restore="${e.id}">Restore</button><button data-purge="${e.id}" class="danger">Delete forever</button></span></div>`).join(''):'<div class="msub">Trash is empty.</div>';
  m.innerHTML=`<h3>Trash</h3><div class="msub">Deleted items are kept here until you empty them. Restore anything, or delete it forever.</div><div id="trashlist">${list}</div><div class="mfoot">${items.length?'<button id="emptyTrash" class="danger" style="margin-right:auto">Empty trash</button>':''}<button id="closeTrash" class="prim">Done</button></div>`;
  $('overlay').classList.add('open');
  m.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{await restoreFromTrash([b.dataset.restore]);openTrash();});
  m.querySelectorAll('[data-purge]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this forever? This cannot be undone.'))return;await purgeFromTrash([b.dataset.purge]);openTrash();});
  const et=$('emptyTrash');if(et)et.onclick=async()=>{if(!confirm('Permanently delete everything in Trash? This cannot be undone.'))return;await purgeFromTrash(trash.map(e=>e.id));openTrash();};
  $('closeTrash').onclick=()=>{$('overlay').classList.remove('open');render();};
}
window.__openTrash=openTrash;
// ---- Backup & Restore ----
function parseBackup(obj){
  // Handles both formats: in-app download {entries,areas,...} and emailed {data:[{key,value}]}
  if(obj&&Array.isArray(obj.data)){
    const o={};obj.data.forEach(row=>{try{o[row.key]=JSON.parse(row.value);}catch(e){}});
    return {entries:o['repo:entries']||[],areas:o['repo:areas']||null,study:o['repo:study']||[],wellness:o['repo:wellness']||{},prefs:o['repo:prefs']||null,trash:o['repo:trash']||[],car:o['repo:car']||[],tolearn:o['repo:tolearn']||[]};
  }
  return {entries:obj.entries||[],areas:obj.areas||null,study:obj.study||[],wellness:obj.wellness||{},prefs:obj.prefs||null,trash:obj.trash||[],car:obj.car||[],tolearn:obj.tolearn||[]};
}
async function applyRestore(p,mode){
  if(mode==='replace'){
    entries=p.entries||[];
    if(p.areas&&p.areas.length)areas=p.areas;
    studySources=p.study||[];
    wellnessLog=p.wellness||{};
    trash=p.trash||[];
    if(p.car&&p.car.length)carRecords=p.car;
    if(p.tolearn&&p.tolearn.length)learnList=p.tolearn;
    if(p.prefs){homeMode=p.prefs.homeMode||homeMode;wsFontScale=p.prefs.wsFontScale||wsFontScale;}
  }else{ // merge: add only items not already present
    const he=new Set(entries.map(e=>e.id));(p.entries||[]).forEach(e=>{if(!he.has(e.id))entries.push(e);});
    const hc=new Set(carRecords.map(r=>r.id));(p.car||[]).forEach(r=>{if(!hc.has(r.id))carRecords.push(r);});
    const hl=new Set(learnList.map(r=>r.id));(p.tolearn||[]).forEach(r=>{if(!hl.has(r.id))learnList.push(r);});
    const ha=new Set(areas.map(a=>a.id));(p.areas||[]).forEach(a=>{if(!ha.has(a.id))areas.push(a);});
    const hs=new Set(studySources.map(s=>s.id));(p.study||[]).forEach(s=>{if(!hs.has(s.id))studySources.push(s);});
    Object.keys(p.wellness||{}).forEach(k=>{if(!(k in wellnessLog))wellnessLog[k]=p.wellness[k];});
    const ht=new Set(trash.map(e=>e.id));(p.trash||[]).forEach(e=>{if(!ht.has(e.id))trash.push(e);});
  }
  await saveEntries();await saveAreas();await saveStudy();await saveWellness();await savePrefs();await saveTrash();await saveCar();await saveLearn();
}
function openBackupModal(){
  const m=$('modal');const bs="padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;color:var(--ink);font-size:13px";
  m.innerHTML=`<h3>Backup &amp; Restore</h3><div class="msub">Download a copy of everything, or restore from a backup file (from the weekly email or a manual download).</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin:14px 0">
      <button id="bkDownload" class="prim">Download a backup now</button>
      <button id="bkRestoreBtn" style="${bs}">Restore from a backup file…</button>
      <input type="file" id="bkFile" accept="application/json,.json" style="display:none">
      <div id="bkSummary" style="display:none;font-size:13px;color:var(--ink);background:var(--accent-soft);padding:10px;border-radius:8px"></div>
      <div id="bkChoices" style="display:none;flex-direction:column;gap:8px">
        <button id="bkMerge" style="${bs}">Restore missing items only (safe)</button>
        <button id="bkReplace" class="danger" style="${bs}">Replace everything with this backup</button>
      </div>
    </div>
    <div class="mfoot"><button id="bkClose" class="prim">Done</button></div>`;
  $('overlay').classList.add('open');
  let parsed=null;
  $('bkDownload').onclick=()=>window.__exportData&&window.__exportData();
  $('bkRestoreBtn').onclick=()=>$('bkFile').click();
  $('bkFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const obj=JSON.parse(r.result);parsed=parseBackup(obj);
      const n=(parsed.entries||[]).length,a=(parsed.areas||[]).length,s=(parsed.study||[]).length;
      $('bkSummary').style.display='block';$('bkSummary').textContent=`This backup has ${n} entries, ${a} areas, and ${s} study sources. Choose how to restore:`;
      $('bkChoices').style.display='flex';
    }catch(err){$('bkSummary').style.display='block';$('bkSummary').textContent='That file is not a valid backup.';$('bkChoices').style.display='none';}};
    r.readAsText(f);e.target.value='';};
  $('bkMerge').onclick=async()=>{if(!parsed)return;await applyRestore(parsed,'merge');alert('Restored missing items.');location.reload();};
  $('bkReplace').onclick=async()=>{if(!parsed)return;if(!confirm('Replace ALL current data with this backup? Your current data will first download as a safety copy, then be overwritten.'))return;if(window.__exportData)window.__exportData();await applyRestore(parsed,'replace');alert('Restored from backup.');location.reload();};
  $('bkClose').onclick=()=>$('overlay').classList.remove('open');
}
window.__openBackup=openBackupModal;
// ---- AI: ask-anything across your data + weekly review (via the secure proxy) ----
async function askAnthropic(content,max_tokens){
  const res=await fetch('/.netlify/functions/anthropic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:max_tokens||800,messages:[{role:'user',content}]})});
  const data=await res.json();
  return (data.content||[]).map(b=>b.type==='text'?b.text:'').join('').trim();
}
function dataForAI(){
  const ar=id=>(areaById(id)||{}).name||'';
  const lines=entries.slice().sort((a,b)=>(((b.when||b.created||'')+'').localeCompare((a.when||a.created||'')+''))).map(e=>{
    const when=e.when||((e.created||'')+'').slice(0,10);
    const t=(TYPES[e.type]&&TYPES[e.type].label)||e.type;
    const body=(((e.title?e.title+': ':'')+(e.text||''))+'').replace(/\s+/g,' ').slice(0,400);
    const tags=(e.tags||[]).map(x=>'#'+x).join(' ');
    return `- [${t}/${ar(e.area)}${when?' '+when:''}] ${body} ${tags}`.trim();
  });

// downscale a File, upload to the photos bucket; resolves {path,dataUrl} (dataUrl reused for OCR)
function uploadCarImage(file){
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith('image/'))return reject(new Error('not an image'));
    const r=new FileReader();
    r.onload=e=>{const img=new Image();
      img.onload=async()=>{
        const max=2000;let w=img.width,h=img.height;if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
        const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl=c.toDataURL('image/jpeg',0.85);
        const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.85));
        if(!blob)return reject(new Error('process failed'));
        const path=`${_uid}/${(window.crypto&&crypto.randomUUID?crypto.randomUUID():uid()+uid())}.jpg`;
        try{const up=await _sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});
          if(up.error)return reject(up.error);
          const su=await _sb.storage.from('photos').createSignedUrl(path,3600);
          if(su.data&&su.data.signedUrl)_urlMap[path]=su.data.signedUrl;
          resolve({path,dataUrl});
        }catch(err){reject(err);}
      };
      img.onerror=()=>reject(new Error('image load failed'));img.src=e.target.result;
    };
    r.onerror=()=>reject(new Error('read failed'));r.readAsDataURL(file);
  });
}

      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:900,messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:m[1],data:m[2]}},
        {type:"text",text:`This is a photo of a car service/maintenance record, invoice, or receipt. Extract the details. Reply ONLY as JSON, no other text: {"vendor":"shop/dealer name or null","date":"YYYY-MM-DD or null","mileage":"odometer reading (number) or null","services":["each service or part as a short phrase"],"total":"total cost exactly as written or null","text":"a clean, COMPLETE plain-text transcription of all readable text on the document"}.`}

// extract dominant + accent colors from an image data-url (browser-side)
function extractPalette(dataUrl,cb){
  const img=new Image();
  img.onload=()=>{
    const n=40;const c=document.createElement('canvas');c.width=n;c.height=n;
    const ctx=c.getContext('2d');ctx.drawImage(img,0,0,n,n);
    let d;try{d=ctx.getImageData(0,0,n,n).data;}catch(e){cb(null);return;}
    const buckets={};
    for(let i=0;i<d.length;i+=4){
      const r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];if(a<125)continue;
      const key=(r>>5)+','+(g>>5)+','+(b>>5);
      const o=buckets[key]||(buckets[key]={r:0,g:0,b:0,n:0});
      o.r+=r;o.g+=g;o.b+=b;o.n++;
    }
    const arr=Object.values(buckets).map(o=>({r:Math.round(o.r/o.n),g:Math.round(o.g/o.n),b:Math.round(o.b/o.n),n:o.n}));
    if(!arr.length){cb(null);return;}
    arr.sort((x,y)=>y.n-x.n);
    const sat=o=>{const mx=Math.max(o.r,o.g,o.b),mn=Math.min(o.r,o.g,o.b);return mx===0?0:(mx-mn)/mx;};
    const dom=arr[0];
    // accent: among the more common colors, prefer ones that are saturated AND mid-toned (not near-white/near-black), weighted a bit by frequency
    const cand=arr.slice(0,10);
    const score=o=>{const l=lum(o);const tone=1-Math.abs(l-0.5)*1.6;const freq=Math.min(o.n/dom.n,1);return sat(o)*1.0 + Math.max(tone,0)*0.5 + freq*0.25;};
    let accent=cand.slice().sort((x,y)=>score(y)-score(x))[0]||dom;
    // deepen very pale accents so they read on text/buttons
    accent=deepen(accent);
    cb({dom,accent});
  };
  img.onerror=()=>cb(null);
  if(/^https?:/.test(dataUrl)) img.crossOrigin='anonymous';
  img.src=dataUrl;
}
function deepen(o){
  let l=lum(o);
  if(l<=0.62)return o;
  const f=0.62/l; // scale toward darker while keeping hue
  return {r:Math.round(o.r*f),g:Math.round(o.g*f),b:Math.round(o.b*f),n:o.n};
}
const rgb=o=>`rgb(${o.r},${o.g},${o.b})`;
const rgba=(o,a)=>`rgba(${o.r},${o.g},${o.b},${a})`;
function lum(o){return (0.299*o.r+0.587*o.g+0.114*o.b)/255;}

// Images are uploaded as real files to the private 'photos' bucket; entries store
// the file PATH. For display we fetch a short-lived signed URL per path and cache it.
// Existing base64/data-URL images still render directly (backward compatible).
const _urlMap={}; // storage path -> signed URL (this session)
function isStoragePath(v){ return !!v && typeof v==='string' && !/^data:|^https?:|^blob:/.test(v); }
function disp(v){ return isStoragePath(v) ? (_urlMap[v]||'') : (v||''); }
async function refreshImageUrls(){
  if(typeof _sb==='undefined'||!_sb) return;
  const paths=new Set();
  entries.forEach(e=>(e.imgs||[]).forEach(v=>{ if(isStoragePath(v)) paths.add(v); }));
  (carRecords||[]).forEach(r=>(r.imgs||[]).forEach(v=>{ if(isStoragePath(v)) paths.add(v); }));
  const need=[...paths].filter(p=>!_urlMap[p]);
  if(!need.length) return;
  try{
    const {data,error}=await _sb.storage.from('photos').createSignedUrls(need,3600);
    if(!error&&data) data.forEach(d=>{ if(d&&d.signedUrl&&d.path) _urlMap[d.path]=d.signedUrl; });
  }catch(e){ console.warn('signed url refresh failed',e); }
}

// minimal, safe markdown -> html (operates on escaped text)
function mdRender(src){
  if(!src)return'';
  let s=esc(src);
  // code spans first (protect their contents)
  const codes=[];s=s.replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return`\u0000C${codes.length-1}\u0000`;});
  const lines=s.split('\n');let out=[],i=0;
  const inline=x=>x
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
    .replace(/_([^_]+)_/g,'<em>$1</em>')
    .replace(/==([^=]+)==/g,'<mark>$1</mark>')
    .replace(/~~([^~]+)~~/g,'<del>$1</del>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  while(i<lines.length){
    let l=lines[i];
    const h=l.match(/^(#{1,4})\s+(.+)/);
    if(h){const lv=h[1].length;out.push(`<h${lv+2} class="md-h">${inline(h[2])}</h${lv+2}>`);i++;continue;}
    if(/^&gt;\s?/.test(l)){let q=[];while(i<lines.length&&/^&gt;\s?/.test(lines[i])){q.push(inline(lines[i].replace(/^&gt;\s?/,'')));i++;}out.push(`<blockquote class="md-q">${q.join('<br>')}</blockquote>`);continue;}
    if(/^\s*[-*+]\s+/.test(l)){let items=[];while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){items.push(`<li>${inline(lines[i].replace(/^\s*[-*+]\s+/,''))}</li>`);i++;}out.push(`<ul class="md-ul">${items.join('')}</ul>`);continue;}
    if(/^\s*\d+\.\s+/.test(l)){let items=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){items.push(`<li>${inline(lines[i].replace(/^\s*\d+\.\s+/,''))}</li>`);i++;}out.push(`<ol class="md-ol">${items.join('')}</ol>`);continue;}
    if(/^(---|\*\*\*)\s*$/.test(l)){out.push('<hr class="md-hr">');i++;continue;}
    if(l.trim()===''){i++;continue;}
    let para=[inline(l)];i++;
    while(i<lines.length&&lines[i].trim()!==''&&!/^(#{1,4}\s|&gt;\s?|\s*[-*+]\s|\s*\d+\.\s|---|\*\*\*)/.test(lines[i])){para.push(inline(lines[i]));i++;}
    out.push(`<p class="md-p">${para.join('<br>')}</p>`);
  }
  let html=out.join('');
  html=html.replace(/\u0000C(\d+)\u0000/g,(_,n)=>`<code class="md-code">${codes[+n]}</code>`);
  return html;
}
